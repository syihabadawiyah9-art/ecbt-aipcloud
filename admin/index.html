<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - E-CBT AIP CLOUD - MTs Al Ishlah Panambangan</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Font Serif Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-hero {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex flex-col justify-between text-slate-800">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- Dynamic Modal Container -->
  <div id="modal-container" class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div id="modal-content" class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 transform transition-all scale-95 opacity-0"></div>
  </div>

  <!-- HEADER / NAVBAR -->
  <header class="bg-[#0f4c42] text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        
        <!-- Logo & Judul Kiri -->
        <a href="../index.html" class="flex items-center gap-3">
          <img src="../aset/logo-kemenag.png" alt="Logo Kemenag" class="w-12 h-12 object-contain drop-shadow" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Logo_Kementerian_Agama_Republik_Indonesia_new_version.png/600px-Logo_Kementerian_Agama_Republik_Indonesia_new_version.png';">
          <div>
            <h1 class="font-bold text-xl tracking-wider text-white">E - C B T &nbsp; A I P &nbsp; C L O U D</h1>
            <p class="text-[11px] text-emerald-200 tracking-wide font-medium">UJIAN SEKOLAH - COMPUTER BASED TEST MANDIRI</p>
          </div>
        </a>

        <!-- Navigation Menu Admin -->
        <nav id="nav-menu" class="flex items-center gap-6 text-sm font-bold tracking-wider">
          <a href="../index.html" class="hover:text-amber-300 transition-colors">BERANDA</a>
          <button id="btn-nav-login" onclick="window.adminApp.openLoginModal()" class="text-amber-300 border-b-2 border-amber-300 pb-1">LOGIN</button>
          
          <div id="admin-logged-badge" class="hidden flex items-center gap-3">
            <span class="bg-emerald-800 text-amber-300 text-xs font-bold px-3 py-1.5 rounded-lg border border-emerald-600">Super Admin</span>
            <button onclick="window.adminApp.logout()" class="text-xs font-bold text-rose-300 hover:text-white bg-rose-900/40 hover:bg-rose-900 px-3 py-1.5 rounded-lg transition-all border border-rose-700">
              Keluar
            </button>
          </div>
        </nav>

      </div>
    </div>
  </header>

  <!-- MAIN DYNAMIC CONTENT -->
  <main id="app-view" class="flex-grow flex items-center justify-center p-6 sm:p-12">
    <!-- Diisi via JS (Tampilan Hero Banner / Dashboard Admin) -->
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-300 py-6 text-center shadow-inner">
    <div class="max-w-7xl mx-auto px-4 flex flex-col items-center justify-center gap-2">
      <img src="../aset/logo-mts.png" alt="Logo MTs Al Ishlah Panambangan" class="w-10 h-10 object-contain" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2991/2991108.png';">
      <p class="text-xs sm:text-sm font-bold text-slate-700 tracking-wider uppercase">
        AIP CLOUD – MTS AL ISHLAH PANAMBANGAN @ 2026 – APLIKASI UJIAN BERBASIS KOMPUTER
      </p>
    </div>
  </footer>

  <script>
    const STORAGE_KEY = 'e_cbt_aip_cloud_db';

    const initialData = {
      adminPassword: 'superadmin123',
      teachers: [
        { id: 'T01', username: 'guru_ipa', name: 'Dr. Budi Santoso, M.Pd', subjects: ['IPA', 'Fisika'] },
        { id: 'T02', username: 'guru_indo', name: 'Siti Rahma, S.Pd', subjects: ['Bahasa Indonesia'] }
      ],
      students: [
        { id: 'S01', username: 'siswa01', name: 'Ahmad Rizky', grade: '7' },
        { id: 'S02', username: 'siswa02', name: 'Dewi Lestari', grade: '8' }
      ],
      schedules: [
        { id: 'SCH01', subject: 'Bahasa Indonesia', grade: '7', token: 'AIP789' }
      ],
      adminSession: false
    };

    class DBController {
      static get() {
        if (!localStorage.getItem(STORAGE_KEY)) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(initialData));
        }
        return JSON.parse(localStorage.getItem(STORAGE_KEY));
      }

      static save(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }
    }

    class AdminApp {
      constructor() {
        this.adminTab = 'summary';
        this.render();
      }

      get db() {
        return DBController.get();
      }

      saveDB(db) {
        DBController.save(db);
      }

      showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `p-4 rounded-xl shadow-lg text-white text-xs font-bold transition-all duration-300 ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`;
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }

      showModal(html) {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.innerHTML = html;
        container.classList.remove('hidden');
        setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
      }

      closeModal() {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => container.classList.add('hidden'), 200);
      }

      openLoginModal() {
        this.showModal(`
          <div class="space-y-4">
            <div class="text-center">
              <div class="inline-flex bg-emerald-100 p-3 rounded-2xl text-[#0f4c42] mb-2">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
              </div>
              <h3 class="font-bold text-slate-900 text-lg">Login Admin Utama</h3>
              <p class="text-xs text-slate-500">Masukkan Kredensial Pengelola Sistem</p>
            </div>

            <form onsubmit="window.adminApp.handleAdminLogin(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username Admin</label>
                <input type="text" id="a-user" required placeholder="adminutama" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="a-pass" required placeholder="Password" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.adminApp.closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-[#0f4c42] hover:bg-[#0d3b36]">Masuk Admin</button>
              </div>
            </form>

            <div class="bg-emerald-50 p-3 rounded-xl text-[11px] text-emerald-800 font-medium text-center">
              Kredensial Demo: <b>adminutama</b> / Password: <b>superadmin123</b>
            </div>
          </div>
        `);
        if (window.lucide) lucide.createIcons();
      }

      handleAdminLogin(e) {
        e.preventDefault();
        const u = document.getElementById('a-user').value.trim();
        const p = document.getElementById('a-pass').value.trim();
        const db = this.db;

        if (u === 'adminutama' && p === (db.adminPassword || 'superadmin123')) {
          db.adminSession = true;
          this.saveDB(db);
          this.closeModal();
          this.showToast('Login Admin Utama Berhasil!');
          this.render();
        } else {
          this.showToast('Username atau Password Admin salah!', 'error');
        }
      }

      logout() {
        const db = this.db;
        db.adminSession = false;
        this.saveDB(db);
        this.showToast('Berhasil keluar dari admin');
        this.render();
      }

      render() {
        const appView = document.getElementById('app-view');
        const db = this.db;
        const btnNavLogin = document.getElementById('btn-nav-login');
        const adminBadge = document.getElementById('admin-logged-badge');

        if (db.adminSession) {
          btnNavLogin.classList.add('hidden');
          adminBadge.classList.remove('hidden');
          appView.className = "flex-grow max-w-6xl w-full mx-auto p-6 sm:p-8";
          appView.innerHTML = this.renderAdminDashboard();
        } else {
          btnNavLogin.classList.remove('hidden');
          adminBadge.classList.add('hidden');
          appView.className = "flex-grow flex items-center justify-center p-6 sm:p-12";
          appView.innerHTML = this.renderAdminHero();
        }

        if (window.lucide) lucide.createIcons();
      }

      // TAMPILAN SESUAI GAMBAR CANVA
      renderAdminHero() {
        return `
          <div class="text-center max-w-4xl mx-auto space-y-6">
            <h2 class="font-hero text-4xl sm:text-5xl md:text-6xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              Selamat Datang
            </h2>
            
            <h3 class="font-hero text-3xl sm:text-4xl md:text-5xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              ADMIN DI
            </h3>

            <h1 class="font-hero text-4xl sm:text-6xl md:text-7xl font-black text-slate-900 leading-tight uppercase tracking-wider drop-shadow-sm">
              E-CBT AIP CLOUD
            </h1>

            <p class="font-hero text-lg sm:text-2xl md:text-3xl font-extrabold text-slate-800 tracking-widest pt-4">
              APLIKASI UJIAN SEKOLAH BERBASIS KOMPUTER
            </p>

            <div class="pt-8">
              <button onclick="window.adminApp.openLoginModal()" class="bg-[#0f4c42] hover:bg-[#0d3b36] text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 text-sm uppercase tracking-wider">
                Klik Untuk Login Admin
              </button>
            </div>
          </div>
        `;
      }

      renderAdminDashboard() {
        const db = this.db;
        return `
          <div class="space-y-6 w-full">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center flex-wrap gap-4">
              <div>
                <h2 class="font-bold text-slate-900 text-lg">Panel Kontrol Super Admin</h2>
                <p class="text-xs text-slate-500">Kelola Guru, Siswa, dan Jadwal Ujian Terpusat</p>
              </div>
            </div>

            <!-- Stats Ringkas -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="p-3.5 bg-indigo-50 text-indigo-600 rounded-xl">
                  <i data-lucide="user-check" class="w-7 h-7"></i>
                </div>
                <div>
                  <p class="text-xs font-semibold text-slate-400 uppercase">Total Guru</p>
                  <p class="text-xl font-bold text-slate-900">${db.teachers.length}</p>
                </div>
              </div>
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="p-3.5 bg-emerald-50 text-emerald-600 rounded-xl">
                  <i data-lucide="users" class="w-7 h-7"></i>
                </div>
                <div>
                  <p class="text-xs font-semibold text-slate-400 uppercase">Total Siswa</p>
                  <p class="text-xl font-bold text-slate-900">${db.students.length}</p>
                </div>
              </div>
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="p-3.5 bg-amber-50 text-amber-600 rounded-xl">
                  <i data-lucide="calendar" class="w-7 h-7"></i>
                </div>
                <div>
                  <p class="text-xs font-semibold text-slate-400 uppercase">Jadwal Ujian</p>
                  <p class="text-xl font-bold text-slate-900">${db.schedules.length}</p>
                </div>
              </div>
            </div>
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.adminApp = new AdminApp();
    });
  </script>
</body>
</html>
