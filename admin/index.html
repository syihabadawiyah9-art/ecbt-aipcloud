<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - E-CBT AIP CLOUD - MTs Al Ishlah Panambangan</title>
  <!-- Tailwind CSS CDN -->

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Font Serif Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;

<body class="bg-slate-100 min-h-screen flex flex-col justify-between text-slate-800">

  <!-- Toast Notification Container -->

  <!-- Hidden File Inputs untuk Impor CSV -->
  <input type="file" id="import-guru-file" accept=".csv, .txt" class="hidden" onchange="window.adminApp.handleImportGuru(event)">
  <input type="file" id="import-siswa-file" accept=".csv, .txt" class="hidden" onchange="window.adminApp.handleImportSiswa(event)">

  <!-- HEADER / NAVBAR UTAMA -->

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        
        <!-- Logo & Judul Kiri -->
        <a href="../index.html" class="flex items-center gap-3">
          <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-md">
            <i data-lucide="graduation-cap" class="w-6 h-6"></i>
          </div>
          <div>
            <h1 class="font-bold text-lg text-slate-900 leading-tight">E-CBT Smart System</h1>
            <p class="text-[11px] text-slate-500 font-medium">Ujian Sekolah Computer Based Test Mandiri</p>
          </div>
        </a>

        <!-- Header Nav / Info Login -->
        <div id="header-nav-actions" class="flex items-center gap-4">
          <a href="../index.html" id="btn-nav-beranda" class="text-xs font-bold text-slate-600 hover:text-indigo-600 transition-colors">BERANDA</a>
          <button id="btn-nav-login" onclick="window.adminApp.openLoginModal()" class="text-xs font-bold text-indigo-600 border border-indigo-600 px-3 py-1.5 rounded-lg hover:bg-indigo-50 transition-colors">LOGIN</button>
          
          <div id="admin-logged-badge" class="hidden flex items-center gap-3">
            <div class="text-right">
              <p id="txt-admin-name" class="text-xs font-bold text-slate-800">Super Admin Utama</p>
              <button onclick="window.adminApp.openAdminProfileModal()" class="text-[10px] font-bold text-indigo-600 hover:underline uppercase tracking-wider">
                ADMIN
              </button>
            </div>
            
            <button onclick="window.adminApp.logout()" class="flex items-center gap-1 text-xs font-bold text-rose-600 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-lg transition-all border border-rose-200">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>

            </button>

        </div>

      </div>
    </div>
  </header>

  <!-- MAIN DYNAMIC CONTENT -->
  <main id="app-view" class="flex-grow flex items-center justify-center p-6 sm:p-10">
    <!-- Diisi via JS -->
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-200 py-6 text-center shadow-inner">
    <div class="max-w-7xl mx-auto px-4 flex flex-col items-center justify-center gap-2">
      <img src="../aset/logo-mts.png" alt="Logo MTs Al Ishlah Panambangan" class="w-9 h-9 object-contain" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2991/2991108.png';">
      <p class="text-xs font-bold text-slate-600 tracking-wider uppercase">
        AIP CLOUD – MTS AL ISHLAH PANAMBANGAN @ 2026 – APLIKASI UJIAN BERBASIS KOMPUTER
      </p>
    </div>
  </footer>

  <script>
    const STORAGE_KEY = 'e_cbt_aip_cloud_db';

    const initialData = {
      adminUser: 'adminutama',
      adminPassword: 'superadmin123',
      adminName: 'Super Admin Utama',
      teachers: [
        { id: '001', name: 'Muhammad Syihabuddin', username: 'syihabadaw', password: '123', subjects: ['Informatika', 'BK'] },
        { id: '002', name: 'Naila', username: 'naila32', password: '123', subjects: [] }
      ],
      students: [
        { id: '001', name: 'Muhammad Syihabuddin', grade: '7', username: 'syihabadaw', password: '123' },
        { id: '002', name: 'Naila', grade: '8', username: 'naila32', password: '123' }
      ],
      schedules: [
        { id: 'SCH01', subject: 'Informatika', grade: '7', start: '19/10/2026, 02.35.00', end: '19/10/2026, 04.35.00', token: 'INF789' }
      ],
      adminSession: false
    };

    class DBController {
      static get() {
        if (!localStorage.getItem(STORAGE_KEY)) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(initialData));
        }
        return JSON.parse(localStorage.getItem(STORAGE_KEY));
      }

      static save(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }
    }

    class AdminApp {
      constructor() {
        this.activeTab = 'dashboard';
        this.render();
      }

      get db() {
        return DBController.get();
      }

      saveDB(data) {
        DBController.save(data);
      }

      showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `p-4 rounded-xl shadow-lg text-white text-xs font-bold transition-all duration-300 ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`;
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }

      showModal(html) {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.innerHTML = html;
        container.classList.remove('hidden');
        setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
      }

      closeModal() {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => container.classList.add('hidden'), 200);
      }

      openLoginModal() {
        this.showModal(`
          <div class="space-y-4">
            <div class="text-center">
              <div class="inline-flex bg-indigo-100 p-3 rounded-2xl text-indigo-700 mb-2">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
              </div>
              <h3 class="font-bold text-slate-900 text-lg">Login Admin Utama</h3>
              <p class="text-xs text-slate-500">Masukkan Kredensial Pengelola Sistem</p>
            </div>

            <form onsubmit="window.adminApp.handleAdminLogin(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username Admin</label>
                <input type="text" id="a-user" required placeholder="adminutama" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="a-pass" required placeholder="Password" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 outline-none">
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.adminApp.closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700">Masuk Admin</button>
              </div>
            </form>

            <div class="bg-indigo-50 p-3 rounded-xl text-[11px] text-indigo-800 font-medium text-center">
              Default Login: <b>adminutama</b> / Password: <b>superadmin123</b>
            </div>
          </div>
        `);
        if (window.lucide) lucide.createIcons();
      }

      handleAdminLogin(e) {
        e.preventDefault();
        const u = document.getElementById('a-user').value.trim();
        const p = document.getElementById('a-pass').value.trim();
        const db = this.db;

        if (u === (db.adminUser || 'adminutama') && p === (db.adminPassword || 'superadmin123')) {
          db.adminSession = true;
          this.saveDB(db);
          this.closeModal();
          this.showToast('Login Admin Berhasil!');
          this.render();
        } else {
          this.showToast('Username atau Password Admin salah!', 'error');
        }
      }

      openAdminProfileModal() {
        const db = this.db;
        this.showModal(`
          <div class="space-y-4">
            <div class="text-center">
              <div class="inline-flex bg-amber-100 p-3 rounded-2xl text-amber-700 mb-2">
                <i data-lucide="key-round" class="w-6 h-6"></i>
              </div>
              <h3 class="font-bold text-slate-900 text-lg">Ubah Akun / Password Admin</h3>
              <p class="text-xs text-slate-500">Perbarui Nama, Username & Password</p>
            </div>

            <form onsubmit="window.adminApp.saveAdminProfile(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Nama Admin</label>
                <input type="text" id="prof-name" value="${db.adminName || 'Super Admin Utama'}" required class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username Baru</label>
                <input type="text" id="prof-user" value="${db.adminUser || 'adminutama'}" required class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password Baru</label>
                <input type="text" id="prof-pass" value="${db.adminPassword || 'superadmin123'}" required class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-indigo-600 outline-none">
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.adminApp.closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700">Simpan Perubahan</button>
              </div>
            </form>
          </div>
        `);
        if (window.lucide) lucide.createIcons();
      }

      saveAdminProfile(e) {
        e.preventDefault();
        const db = this.db;
        db.adminName = document.getElementById('prof-name').value.trim();
        db.adminUser = document.getElementById('prof-user').value.trim();
        db.adminPassword = document.getElementById('prof-pass').value.trim();

        this.saveDB(db);
        this.closeModal();
        this.showToast('Akun Admin Berhasil Diperbarui!');
        this.render();
      }

      logout() {
        const db = this.db;
        db.adminSession = false;
        this.saveDB(db);
        this.showToast('Berhasil keluar dari admin');
        this.render();
      }

      setTab(tab) {
        this.activeTab = tab;
        this.render();
      }

      render() {
        const appView = document.getElementById('app-view');
        const db = this.db;
        const btnNavLogin = document.getElementById('btn-nav-login');
        const btnNavBeranda = document.getElementById('btn-nav-beranda');
        const adminBadge = document.getElementById('admin-logged-badge');
        const txtAdminName = document.getElementById('txt-admin-name');

        if (db.adminSession) {
          btnNavLogin.classList.add('hidden');
          btnNavBeranda.classList.add('hidden');
          adminBadge.classList.remove('hidden');
          if (txtAdminName) txtAdminName.innerText = db.adminName || 'Super Admin Utama';

          appView.className = "flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6";
          appView.innerHTML = this.renderAdminDashboard();
        } else {
          btnNavLogin.classList.remove('hidden');
          btnNavBeranda.classList.remove('hidden');
          adminBadge.classList.add('hidden');

          appView.className = "flex-grow flex items-center justify-center p-6 sm:p-12";
          appView.innerHTML = this.renderAdminHero();
        }

        if (window.lucide) lucide.createIcons();
      }

      renderAdminHero() {
        return `
          <div class="text-center max-w-4xl mx-auto space-y-6">
            <h2 class="font-hero text-4xl sm:text-5xl md:text-6xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              Selamat Datang
            </h2>
            <h3 class="font-hero text-3xl sm:text-4xl md:text-5xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              ADMIN DI
            </h3>
            <h1 class="font-hero text-4xl sm:text-6xl md:text-7xl font-black text-slate-900 leading-tight uppercase tracking-wider drop-shadow-sm">
              E-CBT AIP CLOUD
            </h1>
            <p class="font-hero text-lg sm:text-2xl md:text-3xl font-extrabold text-slate-800 tracking-widest pt-4">
              APLIKASI UJIAN SEKOLAH BERBASIS KOMPUTER
            </p>
            <div class="pt-8">
              <button onclick="window.adminApp.openLoginModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 text-sm uppercase tracking-wider">
                Klik Untuk Login Admin
              </button>
            </div>
          </div>
        `;
      }

      renderAdminDashboard() {
        const tab = this.activeTab;

        return `
          <!-- TABS CONTAINER -->
          <div class="bg-white p-2 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-2 flex-wrap">
            <button onclick="window.adminApp.setTab('dashboard')" class="flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold transition-all ${tab === 'dashboard' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Dashboard
            </button>
            <button onclick="window.adminApp.setTab('guru')" class="flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold transition-all ${tab === 'guru' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
              <i data-lucide="user-check" class="w-4 h-4"></i> Data Guru
            </button>
            <button onclick="window.adminApp.setTab('siswa')" class="flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold transition-all ${tab === 'siswa' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
              <i data-lucide="users" class="w-4 h-4"></i> Data Siswa
            </button>
            <button onclick="window.adminApp.setTab('jadwal')" class="flex items-center gap-1.5 px-4 py-2 rounded-xl text-xs font-bold transition-all ${tab === 'jadwal' ? 'bg-indigo-600 text-white shadow' : 'text-slate-600 hover:bg-slate-100'}">
              <i data-lucide="calendar" class="w-4 h-4"></i> Jadwal & Token
            </button>
          </div>

          <!-- TAB CONTENT -->
          ${tab === 'dashboard' ? this.renderTabDashboardContent() : ''}
          ${tab === 'guru' ? this.renderTabGuruContent() : ''}
          ${tab === 'siswa' ? this.renderTabSiswaContent() : ''}
          ${tab === 'jadwal' ? this.renderTabJadwalContent() : ''}
        `;
      }

      renderTabDashboardContent() {
        const db = this.db;
        return `
          <!-- 3 STATS CARD -->
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-5">
              <div class="p-4 bg-indigo-50 text-indigo-600 rounded-2xl">
                <i data-lucide="user" class="w-8 h-8"></i>
              </div>
              <div>
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">TOTAL GURU</p>
                <p class="text-3xl font-extrabold text-slate-900">${db.teachers.length}</p>
              </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-5">
              <div class="p-4 bg-emerald-50 text-emerald-600 rounded-2xl">
                <i data-lucide="users" class="w-8 h-8"></i>
              </div>
              <div>
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">TOTAL SISWA TERDAFTAR</p>
                <p class="text-3xl font-extrabold text-slate-900">${db.students.length}</p>
              </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-5">
              <div class="p-4 bg-amber-50 text-amber-600 rounded-2xl">
                <i data-lucide="clock" class="w-8 h-8"></i>
              </div>
              <div>
                <p class="text-[11px] font-bold text-slate-400 uppercase tracking-wide">UJIAN SEDANG AKTIF</p>
                <p class="text-3xl font-extrabold text-slate-900">${db.schedules.length}</p>
              </div>
            </div>
          </div>

          <!-- INFORMASI SISTEM CBT -->
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex items-center gap-2 text-indigo-600">
              <i data-lucide="info" class="w-5 h-5"></i>
              <h3 class="font-bold text-slate-900 text-sm">Informasi Sistem CBT</h3>
            </div>
            <p class="text-xs leading-relaxed text-slate-600 font-medium">
              Sistem ini beroperasi 100% Client-side menggunakan LocalStorage. Semua data seperti akun pengguna, jadwal ujian, bank soal, dan nilai disimpan secara offline di browser ini. Anda dapat menguji seluruh fungsi mulai dari pembuatan guru, pengisian bank soal, pengerjaan oleh siswa, hingga rilis nilai tanpa butuh database server.
            </p>
          </div>
        `;
      }

      // UNDUH TEMPLATE CSV GURU (GAMBAR 1)
      downloadGuruTemplate() {
        const csvContent = "data:text/csv;charset=utf-8," + encodeURIComponent("Id.,Nama,Username,Password\n001,Muhammad Syihabuddin,syihabadaw,123\n002,Naila,naila32,123\n");
        const link = document.createElement("a");
        link.setAttribute("href", csvContent);
        link.setAttribute("download", "template_data_guru.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        this.showToast('Template CSV Guru berhasil diunduh!');
      }

      // PROSES UNGGAH/IMPOR MASSAL GURU
      triggerImportGuru() {
        document.getElementById('import-guru-file').click();
      }

      handleImportGuru(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const lines = evt.target.result.split(/\r\n|\n/);
          const db = this.db;
          let addedCount = 0;

          lines.forEach((line, index) => {
            if (index === 0 || !line.trim()) return; // Skip Header
            const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            if (cols.length >= 3) {
              const id = cols[0] || '00' + (db.teachers.length + 1);
              const name = cols[1];
              const username = cols[2];
              const password = cols[3] || '123';

              // Cek jika username belum ada
              if (name && username && !db.teachers.some(t => t.username === username)) {
                db.teachers.push({ id, name, username, password, subjects: [] });
                addedCount++;
              }
            }
          });

          this.saveDB(db);
          this.showToast(`Berhasil mengimpor ${addedCount} data guru!`);
          this.render();
          e.target.value = '';
        };
        reader.readAsText(file);
      }

      renderTabGuruContent() {
        const db = this.db;
        return `
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex justify-between items-center flex-wrap gap-3">
              <div>
                <h3 class="font-bold text-slate-900 text-base">Manajemen Account Guru</h3>
                <p class="text-xs text-slate-500">Tambah akun guru beserta daftar mata pelajaran yang diampu (Multi-Mapel)</p>
              </div>
              <div class="flex items-center gap-2 flex-wrap">
                <button onclick="window.adminApp.downloadGuruTemplate()" class="flex items-center gap-1.5 border border-slate-200 bg-slate-50 text-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-slate-100">
                  <i data-lucide="download" class="w-3.5 h-3.5"></i> Template CSV

                <button onclick="window.adminApp.triggerImportGuru()" class="flex items-center gap-1.5 border border-emerald-300 bg-emerald-50 text-emerald-800 px-3 py-1.5 rounded-xl text-xs font-bold hover:bg-emerald-100">
                  <i data-lucide="file-spread-sheet" class="w-3.5 h-3.5"></i> Impor Massal
                </button>
                <button onclick="window.adminApp.openAddGuruModal()" class="flex items-center gap-1.5 bg-indigo-600 text-white px-3.5 py-1.5 rounded-xl text-xs font-bold hover:bg-indigo-700">
                  <i data-lucide="plus" class="w-3.5 h-3.5"></i> Tambah Guru
                </button>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-700">
                <thead class="bg-slate-50 font-bold text-slate-500 border-y border-slate-200 uppercase">
                  <tr>
                    <th class="p-3">ID</th>
                    <th class="p-3">NAMA GURU</th>
                    <th class="p-3">USERNAME</th>
                    <th class="p-3">PASSWORD</th>
                    <th class="p-3">MAPEL DIAMPU</th>
                    <th class="p-3 text-center">AKSI</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${db.teachers.map(t => `
                    <tr>
                      <td class="p-3 text-slate-400 font-mono">${t.id}</td>
                      <td class="p-3 font-bold text-slate-900">${t.name}</td>
                      <td class="p-3 font-mono text-slate-600">${t.username}</td>
                      <td class="p-3 font-mono text-slate-600">${t.password || '123'}</td>
                      <td class="p-3">
                        <div class="flex items-center gap-1 flex-wrap">

      saveGuruSubject(e, guruId) {
        e.preventDefault();
        const db = this.db;
        const newSubj = document.getElementById('add-subj-input').value.trim();
        const teacher = db.teachers.find(t => t.id === guruId);

        if (teacher) {

        this.render();

      removeSubjectFromGuru(guruId, subjName) {
        const db = this.db;
        const teacher = db.teachers.find(t => t.id === guruId);
        if (teacher && teacher.subjects) {
          teacher.subjects = teacher.subjects.filter(s => s !== subjName);
          this.saveDB(db);
          this.showToast(`Mapel '${subjName}' dihapus dari ${teacher.name}`);
          this.render();

      // UNDUH TEMPLATE CSV SISWA (GAMBAR 2)
      downloadSiswaTemplate() {
        const csvContent = "data:text/csv;charset=utf-8," + encodeURIComponent("Id.,Nama,Kelas,Username,Password\n001,Muhammad Syihabuddin,7,syihabadaw,123\n002,Naila,8,naila32,123\n");
        const link = document.createElement("a");
        link.setAttribute("href", csvContent);
        link.setAttribute("download", "template_data_siswa.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        this.showToast('Template CSV Siswa berhasil diunduh!');
      }

      // PROSES UNGGAH/IMPOR MASSAL SISWA
      triggerImportSiswa() {
        document.getElementById('import-siswa-file').click();
      }

      handleImportSiswa(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const lines = evt.target.result.split(/\r\n|\n/);
          const db = this.db;
          let addedCount = 0;

          lines.forEach((line, index) => {
            if (index === 0 || !line.trim()) return; // Skip Header
            const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            if (cols.length >= 4) {
              const id = cols[0] || '00' + (db.students.length + 1);
              const name = cols[1];
              const grade = cols[2] || '7';
              const username = cols[3];
              const password = cols[4] || '123';

              if (name && username && !db.students.some(s => s.username === username)) {
                db.students.push({ id, name, grade, username, password });
                addedCount++;
              }
            }
          });

          this.saveDB(db);
          this.showToast(`Berhasil mengimpor ${addedCount} data siswa!`);
          this.render();
          e.target.value = '';
        };
        reader.readAsText(file);
      }

          subject: subj,
          grade: grade,
          start: start,
          end: end,

        });

        this.showToast(`Jadwal berhasil disimpan! Token: ${token}`);
