          ]
        }
      ],
      adminSession: false

    let cacheData = null;

    class DBController {
      static initListener(callback) {
        dbRealtime.ref('cbt_db').on('value', (snapshot) => {
          const val = snapshot.val();
          if (!val) {
            dbRealtime.ref('cbt_db').set(initialData);
            cacheData = initialData;
          } else {
            cacheData = val;
            if (!cacheData.subjects) cacheData.subjects = initialData.subjects;
            if (!cacheData.masterStudents) cacheData.masterStudents = initialData.masterStudents;
            if (!cacheData.teachers) cacheData.teachers = [];
            if (!cacheData.examEvents) cacheData.examEvents = [];
          }
          if (callback) callback();
        });
      }

      static get() { return cacheData || initialData; }
      static save(data) { cacheData = data; dbRealtime.ref('cbt_db').set(data); }
    }

    class AdminApp {
      constructor() {
        this.selectedEventId = null; // null = Main Dashboard (Daftar Tes)
        this.activeSubTab = 'dashboard'; // 'dashboard'|'siswa'|'guru'|'jadwal'|'monitoring'
        this.teacherSubTab = 'guru';
        this.monitoringTab = 'kontrol';
        this.studentFilterGrade = 'ALL';
        this.studentSearch = '';

        DBController.initListener(() => this.render());
        setInterval(() => this.checkScheduleAutoExpiration(), 10000);
      }

      get db() { return DBController.get(); }
      saveDB(data) { DBController.save(data); }

      showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `p-4 rounded-xl shadow-lg text-white text-xs font-bold transition-all duration-300 ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`;
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }

      showModal(html) {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.innerHTML = html;
        container.classList.remove('hidden');
        setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
      }

      closeModal() {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => container.classList.add('hidden'), 200);
      }

      checkScheduleAutoExpiration() {
        const db = this.db;
        if (!db.examEvents) return;

        const now = new Date();
        const currentDateStr = now.toISOString().split('T')[0];
        const currentTimeStr = now.toTimeString().substring(0, 5);
        let isUpdated = false;

        db.examEvents.forEach(evt => {
          if (evt.schedules) {
            evt.schedules.forEach(sc => {
              if (sc.isActive) {
                if (sc.date < currentDateStr || (sc.date === currentDateStr && sc.endTime <= currentTimeStr)) {
                  sc.isActive = false;
                  isUpdated = true;
                }
              }
            });
          }
        });

        if (isUpdated) {
          this.saveDB(db);
          this.render();
        }
      }

      openLoginModal() {
        this.showModal(`
          <div class="space-y-4">
            <div class="text-center">
              <div class="inline-flex bg-emerald-100 p-3 rounded-2xl text-[#0f4c42] mb-2">
                <i data-lucide="shield-check" class="w-6 h-6"></i>
              </div>
              <h3 class="font-bold text-slate-900 text-lg">Login Admin Utama</h3>
              <p class="text-xs text-slate-500">Masukkan Kredensial Pengelola Sistem</p>
            </div>

            <form onsubmit="window.adminApp.handleAdminLogin(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username Admin</label>
                <input type="text" id="a-user" required placeholder="adminutama" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="a-pass" required placeholder="Password" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.adminApp.closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-[#0f4c42] hover:bg-[#0d3b36]">Masuk Admin</button>
              </div>
            </form>

            <div class="bg-emerald-50 p-3 rounded-xl text-[11px] text-emerald-800 font-medium text-center">
              Default Login: <b>adminutama</b> / Password: <b>superadmin123</b>
            </div>
          </div>
        `);
        if (window.lucide) lucide.createIcons();
      }

      handleAdminLogin(e) {
        e.preventDefault();
        const u = document.getElementById('a-user').value.trim();
        const p = document.getElementById('a-pass').value.trim();
        const db = this.db;

        if (u === (db.adminUser || 'adminutama') && p === (db.adminPassword || 'superadmin123')) {
          db.adminSession = true;
          this.saveDB(db);
          this.closeModal();
          this.showToast('Login Admin Utama Berhasil!');
          this.render();
        } else {
          this.showToast('Username atau Password Admin salah!', 'error');
        }
      }

      openAdminProfileModal() {
        const db = this.db;
        this.showModal(`

            <div class="text-center">

      saveAdminProfile(e) {
        e.preventDefault();
        const db = this.db;
        db.adminName = document.getElementById('prof-name').value.trim();
        db.adminUser = document.getElementById('prof-user').value.trim();
        db.adminPassword = document.getElementById('prof-pass').value.trim();

        this.saveDB(db);
        this.closeModal();
        this.showToast('Akun Admin Berhasil Diperbarui!');
        this.render();
      }

      logout() {
        const db = this.db;
        db.adminSession = false;
        this.selectedEventId = null;
        this.saveDB(db);
        this.showToast('Berhasil keluar dari admin');
        this.render();
      }

      render() {
        const appView = document.getElementById('app-view');
        const db = this.db;
        const btnNavLogin = document.getElementById('btn-nav-login');
        const btnNavBeranda = document.getElementById('btn-nav-beranda');
        const adminBadge = document.getElementById('admin-logged-badge');

          btnNavLogin.classList.add('hidden');
          btnNavBeranda.classList.add('hidden');
          adminBadge.classList.remove('hidden');
          appView.className = "flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6";

          if (!this.selectedEventId) {
            appView.innerHTML = this.renderMainDashboardEvents();
          } else {
            appView.innerHTML = this.renderEventSubDashboard();
          }
        } else {
          btnNavLogin.classList.remove('hidden');
          btnNavBeranda.classList.remove('hidden');
          adminBadge.classList.add('hidden');
          appView.className = "flex-grow flex items-center justify-center p-6 sm:p-12";
          appView.innerHTML = this.renderAdminHero();
        }

        if (window.lucide) lucide.createIcons();
      }

      downloadSiswaTemplateExcel() {
        const templateData = [
          ['ID', 'Username', 'Password', 'NAMA ', 'Kelas'],
          ['001', 'albin001', '123', 'ALBIN FABRIZIO ALKHALIFI', '7'],
          ['002', 'alifa002', '123', 'ALIFA RIZKY ALGYANI', '7'],
          ['003', 'alvin003', '123', 'ALVIN PRATISTA', '8'],
          ['004', 'amira004', '123', 'AMIRA KARTIKA RAMADHINA', '9'],
          ['005', 'syihab005', '123', 'MUHAMMAD SYIHABUDDIN', 'Olimpiade']
        ];

        const worksheet = XLSX.utils.aoa_to_sheet(templateData);
        worksheet['!cols'] = [{ wch: 10 }, { wch: 15 }, { wch: 15 }, { wch: 35 }, { wch: 15 }];
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'Sheet1');

        XLSX.writeFile(workbook, 'template input siswa.xlsx');
        this.showToast('Template Excel Siswa berhasil diunduh!');
      }

      triggerImportSiswa() { document.getElementById('import-siswa-file').click(); }

      handleImportSiswa(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

          const db = this.db;
          const currentEvt = this.currentEvent;
          if (!currentEvt.students) currentEvt.students = [];
          let addedCount = 0;

          jsonData.forEach((row, index) => {
            if (index === 0 || !row || row.length === 0) return;
            const id = row[0] ? String(row[0]).trim() : '00' + (currentEvt.students.length + 1);
            const username = row[1] ? String(row[1]).trim() : '';
            const password = row[2] ? String(row[2]).trim() : '123';
            const name = row[3] ? String(row[3]).trim() : '';
            const grade = row[4] ? String(row[4]).trim() : '7';

            if (name && username && !currentEvt.students.some(s => s.username === username)) {
              currentEvt.students.push({ id, username, password, name, grade });
              addedCount++;
            }
          });

          this.saveDB(db);
          this.showToast(`Berhasil mengimpor ${addedCount} data siswa ke Kegiatan ini!`);
          this.render();
          e.target.value = '';
        };
        reader.readAsArrayBuffer(file);
      }

      downloadGuruTemplateExcel() {
        const templateData = [
          ['No', 'Username', 'Nama', 'NIP/NPK/Peg.Id', 'Password', 'Mapel'],
          [1, 'syihabadaw', 'MUHAMMAD SYIHABUDDIN QOSTHALANI', '20244536196002', '123', 'Informatika, Bimbingan Konseling (BK)'],
          [2, 'naila32', 'NAILA', '198503122001', '123', 'Bahasa Indonesia']
        ];

        const worksheet = XLSX.utils.aoa_to_sheet(templateData);
        worksheet['!cols'] = [{ wch: 6 }, { wch: 15 }, { wch: 35 }, { wch: 20 }, { wch: 12 }, { wch: 35 }];
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'Sheet1');

        XLSX.writeFile(workbook, 'template input guru.xlsx');
        this.showToast('Template Excel Guru berhasil diunduh!');
      }

      triggerImportGuru() { document.getElementById('import-guru-file').click(); }

      handleImportGuru(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
          const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

          const db = this.db;
          if (!db.teachers) db.teachers = [];
          if (!db.subjects) db.subjects = [];
          let addedCount = 0;

          jsonData.forEach((row, index) => {
            if (index === 0 || !row || row.length === 0) return;
            const username = row[1] ? String(row[1]).trim() : '';
            const name = row[2] ? String(row[2]).trim() : '';
            const nuptk = row[3] ? String(row[3]).trim() : '';
            const password = row[4] ? String(row[4]).trim() : '123';
            const mapelStr = row[5] ? String(row[5]).trim() : '';

            const subjectsArr = mapelStr ? mapelStr.split(',').map(s => s.trim()).filter(s => s.length > 0) : [];

            subjectsArr.forEach(s => {
              if (!db.subjects.includes(s)) db.subjects.push(s);
            });

            if (name && username && !db.teachers.some(t => t.username === username)) {
              db.teachers.push({
                id: '00' + (db.teachers.length + 1),
                username, name, nuptk, password,
                subjects: subjectsArr
              });
              addedCount++;
            }
          });

          this.saveDB(db);
          this.showToast(`Berhasil mengimpor ${addedCount} data guru!`);
          this.render();
          e.target.value = '';
        };
        reader.readAsArrayBuffer(file);
      }

              </div>

              <div>
                <label class="block font-bold text-slate-700 mb-1">Tanggal Ujian</label>
                <input type="date" id="j-date" required value="${target ? target.date : '2026-10-20'}" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#0f4c42]">
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Jam Mulai</label>
                  <input type="time" id="j-start" required value="${target ? target.startTime : '07:30'}" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#0f4c42]">
                </div>
                <div>
                  <label class="block font-bold text-slate-700 mb-1">Jam Selesai</label>
                  <input type="time" id="j-end" required value="${target ? target.endTime : '08:30'}" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#0f4c42]">
                </div>
              </div>

              <div>
                <label class="block font-bold text-slate-700 mb-1">Durasi Ujian (Menit)</label>
                <input type="number" id="j-dur" required value="${target ? target.duration : 60}" min="5" max="300" class="w-full p-2.5 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-[#0f4c42]">
              </div>

              <div>
                <div class="flex justify-between items-center mb-1">
                  <label class="block font-bold text-slate-700">Token Ujian</label>
                  <button type="button" onclick="window.adminApp.generateRandomToken()" class="text-[10px] font-bold text-emerald-800">🎲 Acak Token Auto</button>
                </div>
                <input type="text" id="j-token" required placeholder="AIP789" value="${target ? target.token : 'AIP789'}" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs font-mono font-bold uppercase focus:ring-2 focus:ring-[#0f4c42]">
              </div>

              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.adminApp.closeModal()" class="px-4 py-2 rounded-xl font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl font-bold text-white bg-[#0f4c42]">Simpan Jadwal Ujian</button>
              </div>
            </form>
          </div>
        `);
      }

      generateRandomToken() {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        let token = '';
        for (let i = 0; i < 6; i++) {
          token += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        const tokenInput = document.getElementById('j-token');
        if (tokenInput) tokenInput.value = token;
      }

      saveJadwal(e, editId) {
        e.preventDefault();
        const db = this.db;
        const evt = this.currentEvent;
        if (!evt.schedules) evt.schedules = [];

        const subject = document.getElementById('j-subj').value;
        const grade = document.getElementById('j-grade').value;
        const date = document.getElementById('j-date').value;
        const startTime = document.getElementById('j-start').value;
        const endTime = document.getElementById('j-end').value;
        const duration = parseInt(document.getElementById('j-dur').value) || 60;
        const token = document.getElementById('j-token').value.trim().toUpperCase();

        if (editId) {
          const idx = evt.schedules.findIndex(sc => sc.id === editId);
          if (idx !== -1) {
            evt.schedules[idx] = { ...evt.schedules[idx], subject, grade, date, startTime, endTime, duration, token };
            this.showToast('Jadwal Ujian berhasil diperbarui!');
          }
        } else {
          evt.schedules.push({
            id: 'SCH' + Date.now(),
            subject, grade, date, startTime, endTime, duration, token,
            isActive: false
          });
          this.showToast('Jadwal Ujian baru berhasil dibuat!');
        }

        this.saveDB(db);
        this.closeModal();
        this.render();
      }

      deleteJadwal(id) {
        if (confirm('Hapus jadwal ujian ini?')) {
          const db = this.db;
          const evt = this.currentEvent;
          evt.schedules = (evt.schedules || []).filter(sc => sc.id !== id);
          this.saveDB(db);
          this.showToast('Jadwal dihapus!');
          this.render();
        }
      }

      // MODUL 5: MONITORING REALTIME, KONTROL SESI & REKAP GLOBAL
      clearAllExamResults() {
        if (confirm('Apakah Anda YAKIN ingin MENGHAPUS SEMUA REKAP NILAI UJIAN pada kegiatan ini?')) {
          const db = this.db;
          const evt = this.currentEvent;
          evt.examResults = [];
          this.saveDB(db);
          this.showToast('Seluruh rekap nilai berhasil dibersihkan!');
          this.render();
        }
      }

      renderSubTabMonitoring() {
        const mTab = this.monitoringTab;

        return `
          <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
            
            <div class="flex justify-between items-center flex-wrap gap-2 border-b border-slate-200 pb-4">
              <div>
                <h3 class="font-bold text-slate-900 text-base">🎛️ Monitoring Realtime, Kontrol Sesi & Rekap Global</h3>
                <p class="text-xs text-slate-500">Saklar Sesi Ujian & Rekapitulasi Nilai Seluruh Rombel</p>
              </div>

              <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
                <button onclick="window.adminApp.monitoringTab='kontrol'; window.adminApp.render();" class="px-4 py-1.5 rounded-lg text-xs font-bold ${mTab === 'kontrol' ? 'bg-[#0f4c42] text-white' : 'text-slate-600'}">⚡ Saklar & Monitoring</button>
                <button onclick="window.adminApp.monitoringTab='rekap'; window.adminApp.render();" class="px-4 py-1.5 rounded-lg text-xs font-bold ${mTab === 'rekap' ? 'bg-[#0f4c42] text-white' : 'text-slate-600'}">📊 Rekap Nilai Global</button>
              </div>
            </div>

            ${mTab === 'kontrol' ? this.renderKontrolSesiSection() : this.renderRekapNilaiGlobalSection()}

          </div>
        `;
      }

      renderKontrolSesiSection() {
        const evt = this.currentEvent;
        const schedules = evt.schedules || [];
        const results = evt.examResults || [];

        return `
          <div class="space-y-6 text-xs">
            
            <div class="space-y-3">
              <h4 class="font-bold text-slate-900 text-xs text-rose-700 flex items-center gap-1.5">
                <i data-lucide="power" class="w-4 h-4"></i> Saklar Sesi Ujian Realtime (Aktifkan / Matikan)
              </h4>

              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-700">
                  <thead class="bg-slate-100 font-bold text-slate-800 uppercase">
                    <tr>
                      <th class="p-3 rounded-l-xl">No</th>
                      <th class="p-3">Mata Pelajaran</th>
                      <th class="p-3">Tingkat Utama</th>
                      <th class="p-3">Tanggal / Waktu</th>
                      <th class="p-3">Token Ujian</th>
                      <th class="p-3">Status Sesi</th>
                      <th class="p-3 rounded-r-xl text-right">Saklar Kontrol Sesi</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${schedules.map((sc, idx) => `
                      <tr>
                        <td class="p-3 font-bold">${idx + 1}</td>
                        <td class="p-3 font-bold text-slate-900">${sc.subject}</td>
                        <td class="p-3"><span class="bg-slate-100 px-2 py-0.5 rounded font-bold text-slate-700">Tingkat ${sc.grade}</span></td>
                        <td class="p-3 font-mono">${sc.date} (${sc.startTime} - ${sc.endTime})</td>
                        <td class="p-3"><code class="bg-emerald-50 text-emerald-800 font-mono font-bold px-2 py-1 rounded border border-emerald-200">${sc.token}</code></td>
                        <td class="p-3">
                          ${sc.isActive ? `<span class="bg-emerald-100 text-emerald-900 font-black px-2.5 py-1 rounded-full text-[10px]">🟢 SEDANG AKTIF</span>` : `<span class="bg-slate-200 text-slate-600 font-bold px-2.5 py-1 rounded-full text-[10px]">⚪ NONAKTIF</span>`}
                        </td>
                        <td class="p-3 text-right">
                          <button onclick="window.adminApp.toggleScheduleActive('${sc.id}')" class="px-3 py-1.5 rounded-lg font-bold shadow ${sc.isActive ? 'bg-rose-600 text-white hover:bg-rose-700' : 'bg-emerald-600 text-white hover:bg-emerald-700'}">
                            ${sc.isActive ? '🔴 MATIKAN SESI' : '🟢 BUKA SESI UJIAN'}
                          </button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="space-y-3 pt-4 border-t border-slate-200">
              <h4 class="font-bold text-slate-900 text-xs flex items-center gap-1.5">
                <i data-lucide="eye" class="w-4 h-4 text-emerald-700"></i> Live Monitoring Siswa Aktif Ujian (Realtime)
              </h4>

              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs text-slate-700">
                  <thead class="bg-slate-100 font-bold text-slate-800 uppercase">
                    <tr>
                      <th class="p-3 rounded-l-xl">No</th>
                      <th class="p-3">ID Siswa</th>
                      <th class="p-3">Nama Lengkap Siswa</th>
                      <th class="p-3">Tingkat Utama</th>
                      <th class="p-3">Kelas Detail (Rombel)</th>
                      <th class="p-3 rounded-r-xl text-right">Status Ujian</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${results.map((r, idx) => `
                      <tr>
                        <td class="p-3 font-bold">${idx + 1}</td>
                        <td class="p-3 font-mono font-bold text-emerald-800">${r.studentId || '00' + (idx+1)}</td>
                        <td class="p-3 font-bold text-slate-900">${r.studentName}</td>
                        <td class="p-3"><span class="bg-slate-100 px-2 py-0.5 rounded font-bold">Tingkat ${r.grade}</span></td>
                        <td class="p-3"><span class="bg-emerald-100 text-emerald-900 font-black px-2.5 py-1 rounded text-xs">${r.classDetail || '7A'}</span></td>
                        <td class="p-3 text-right">
                          <span class="bg-emerald-100 text-emerald-900 font-bold px-2 py-0.5 rounded">✅ Selesai</span>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
                ${results.length === 0 ? `<p class="text-xs text-slate-400 text-center py-6">Belum ada aktivitas ujian siswa terdeteksi.</p>` : ''}
              </div>
            </div>

          </div>
        `;
      }

      toggleScheduleActive(scId) {
        const db = this.db;
        const evt = this.currentEvent;
        const sc = (evt.schedules || []).find(s => s.id === scId);
        if (sc) {
          sc.isActive = !sc.isActive;
          this.saveDB(db);
          this.showToast(`Status Sesi Ujian '${sc.subject}' Diperbarui!`);
          this.render();
        }
      }

      renderRekapNilaiGlobalSection() {
        const evt = this.currentEvent;
        const results = evt.examResults || [];

        return `
          <div class="space-y-4 text-xs">
            <div class="flex justify-between items-center border-b border-slate-200 pb-3 flex-wrap gap-2">
              <h4 class="font-bold text-slate-900 text-xs">Rekap Nilai Global (${results.length} Data)</h4>
              
              <div class="flex items-center gap-2">
                <button onclick="window.adminApp.downloadRekapGlobalExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow">
                  <i data-lucide="download" class="w-4 h-4"></i> Download Rekap Global Excel (.xlsx)
                </button>
                <button onclick="window.adminApp.clearAllExamResults()" class="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1 shadow">
                  Clear All Rekap Nilai
                </button>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-700">
                <thead class="bg-slate-100 font-bold text-slate-800 uppercase">
                  <tr>
                    <th class="p-3 rounded-l-xl">No</th>
                    <th class="p-3">ID Siswa</th>
                    <th class="p-3">Nama Siswa</th>
                    <th class="p-3">Tingkat Utama</th>
                    <th class="p-3">Kelas Detail (Rombel)</th>
                    <th class="p-3">Mata Pelajaran</th>
                    <th class="p-3">Skor PG</th>
                    <th class="p-3">Skor Esai</th>
                    <th class="p-3 rounded-r-xl">Total Nilai</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${results.map((r, idx) => `
                    <tr>
                      <td class="p-3 font-bold">${idx + 1}</td>
                      <td class="p-3 font-mono font-bold text-emerald-800">${r.studentId || '00' + (idx+1)}</td>
                      <td class="p-3 font-bold text-slate-900">${r.studentName}</td>
                      <td class="p-3"><span class="bg-slate-100 px-2 py-0.5 rounded font-bold">Tingkat ${r.grade}</span></td>
                      <td class="p-3"><span class="bg-amber-100 text-amber-900 font-black px-2.5 py-1 rounded text-xs">${r.classDetail || '7A'}</span></td>
                      <td class="p-3 font-bold text-emerald-900">${r.subject || 'Informatika'}</td>
                      <td class="p-3 font-bold text-emerald-700">${r.pgScore || 0}</td>
                      <td class="p-3 font-bold text-amber-700">${r.essayScore || 0}</td>
                      <td class="p-3"><span class="bg-emerald-100 text-emerald-900 font-black px-2.5 py-1 rounded text-xs">${(r.pgScore || 0) + (r.essayScore || 0)}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
              ${results.length === 0 ? `<p class="text-xs text-slate-400 text-center py-6">Belum ada rekap nilai terkumpul.</p>` : ''}
            </div>
          </div>
        `;
      }

      downloadRekapGlobalExcel() {
        const evt = this.currentEvent;
        const results = evt.examResults || [];

        if (results.length === 0) {
          this.showToast('Belum ada data nilai untuk diunduh!', 'error');
          return;
        }

        const excelData = [
          [`REKAP NILAI UJIAN: ${evt.title.toUpperCase()}`, '', '', '', '', '', '', ''],
          ['No', 'ID Siswa', 'Nama Siswa', 'Tingkat Utama', 'Kelas Detail', 'Mata Pelajaran', 'Skor PG', 'Skor Esai', 'Total Nilai']
        ];

        results.forEach((r, idx) => {
          excelData.push([
            idx + 1,
            r.studentId || '00' + (idx+1),
            r.studentName || '',
            r.grade || '7',
            r.classDetail || '7A',
            r.subject || 'Informatika',
            r.pgScore || 0,
            r.essayScore || 0,
            (r.pgScore || 0) + (r.essayScore || 0)
          ]);
        });

        const worksheet = XLSX.utils.aoa_to_sheet(excelData);
        worksheet['!cols'] = [{ wch: 6 }, { wch: 12 }, { wch: 35 }, { wch: 15 }, { wch: 15 }, { wch: 25 }, { wch: 10 }, { wch: 10 }, { wch: 12 }];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'Rekap Nilai');

        XLSX.writeFile(workbook, `Rekap_Nilai_${evt.title.replace(/\s+/g, '_')}.xlsx`);
        this.showToast('File Rekap Nilai Global Excel Berhasil Diunduh!');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.adminApp = new AdminApp();
    });
  </script>
</body>
</html>
