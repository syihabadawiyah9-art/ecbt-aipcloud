<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-CBT AIP CLOUD - MTs Al Ishlah Panambangan</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Serif / Serif Display untuk Teks Judul Utama -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-hero {
      font-family: 'Playfair Display', serif;
    }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex flex-col justify-between text-slate-800">

  <!-- HEADER / NAVBAR -->
  <header class="bg-[#0f4c42] text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        
        <!-- Logo & Judul Kiri -->
        <div class="flex items-center gap-3">
          <!-- Logo Kemenag / Sekolah -->
          <img src="aset/mts.png" alt="Logo Kemenag" class="w-12 h-12 object-contain drop-shadow" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Logo_Kementerian_Agama_Republik_Indonesia_new_version.png/600px-Logo_Kementerian_Agama_Republik_Indonesia_new_version.png';">
          <div>
            <h1 class="font-bold text-xl tracking-wider text-white">E - C B T &nbsp; A I P &nbsp; C L O U D</h1>
            <p class="text-[11px] text-emerald-200 tracking-wide font-medium">UJIAN SEKOLAH - COMPUTER BASED TEST MANDIRI</p>
          </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="hidden md:flex items-center gap-6 text-sm font-bold tracking-wider">
          <a href="#beranda" class="text-amber-300 border-b-2 border-amber-300 pb-1">BERANDA</a>
          <a href="#siswa" onclick="alert('Menu Siswa akan kita hubungkan di tahap selanjutnya!')" class="hover:text-amber-300 transition-colors">SISWA</a>
          <a href="#guru" onclick="alert('Menu Guru akan kita hubungkan di tahap selanjutnya!')" class="hover:text-amber-300 transition-colors">GURU</a>
          <a href="#admin" onclick="alert('Menu Admin akan kita hubungkan di tahap selanjutnya!')" class="hover:text-amber-300 transition-colors">ADMIN</a>
        </nav>

        <!-- Mobile Menu Button -->
        <div class="md:hidden">
          <button onclick="toggleMobileMenu()" class="text-white hover:text-amber-300 focus:outline-none">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
          </button>
        </div>

      </div>
    </div>

    <!-- Mobile Dropdown Navigation -->
    <div id="mobile-menu" class="hidden md:hidden bg-[#0d3b36] border-t border-emerald-800 px-4 pt-2 pb-4 space-y-2 text-sm font-bold">
      <a href="#beranda" class="block py-2 text-amber-300">BERANDA</a>
      <a href="#siswa" onclick="alert('Menu Siswa')" class="block py-2 text-white hover:text-amber-300">SISWA</a>
      <a href="#guru" onclick="alert('Menu Guru')" class="block py-2 text-white hover:text-amber-300">GURU</a>
      <a href="#admin" onclick="alert('Menu Admin')" class="block py-2 text-white hover:text-amber-300">ADMIN</a>
    </div>
  </header>

  <!-- MAIN HERO / BANNER UTAMA -->
  <main class="flex-grow flex items-center justify-center p-6 sm:p-12">
    <div class="text-center max-w-4xl mx-auto space-y-6">
      
      <h2 class="font-hero text-4xl sm:text-5xl md:text-6xl font-black text-slate-900 leading-tight uppercase tracking-wide">
        Selamat Datang
      </h2>
      
      <h3 class="font-hero text-3xl sm:text-4xl md:text-5xl font-black text-slate-900 leading-tight uppercase tracking-wide">
        Di
      </h3>

      <h1 class="font-hero text-4xl sm:text-6xl md:text-7xl font-black text-slate-900 leading-tight uppercase tracking-wider drop-shadow-sm">
        E-CBT AIP CLOUD
      </h1>

      <p class="font-hero text-lg sm:text-2xl md:text-3xl font-extrabold text-slate-800 tracking-widest pt-4">
        APLIKASI UJIAN SEKOLAH BERBASIS KOMPUTER
      </p>

      <!-- Quick Action Buttons -->
      <div class="pt-8 flex flex-wrap justify-center gap-4">
        <button onclick="alert('Menuju Login Siswa')" class="bg-[#0f4c42] hover:bg-[#0d3b36] text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 text-sm uppercase tracking-wider">
          Masuk Ujian Siswa
        </button>
        <button onclick="alert('Menuju Portal Guru/Admin')" class="bg-white hover:bg-slate-50 text-[#0f4c42] border-2 border-[#0f4c42] px-8 py-3.5 rounded-xl font-bold shadow-md hover:shadow-lg transition-all transform hover:-translate-y-0.5 text-sm uppercase tracking-wider">
          Portal Guru & Admin
        </button>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-300 py-6 text-center shadow-inner">
    <div class="max-w-7xl mx-auto px-4 flex flex-col items-center justify-center gap-2">
      <!-- Logo Bawah / Lambang Sekolah -->
      <img src="aset/aip 1.png" alt="Logo MTs Al Ishlah Panambangan" class="w-10 h-10 object-contain" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2991/2991108.png';">
      <p class="text-xs sm:text-sm font-bold text-slate-700 tracking-wider uppercase">
        AIP CLOUD – MTS AL ISHLAH PANAMBANGAN @ 2026 – APLIKASI UJIAN BERBASIS KOMPUTER
      </p>
    </div>
  </footer>

  <script>
    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      menu.classList.toggle('hidden');
    }
  </script>
</body>
</html>
