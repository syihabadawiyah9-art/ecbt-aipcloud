<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guru - E-CBT AIP CLOUD - MTs Al Ishlah Panambangan</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- MathJax CDN untuk Render Rumus Matematika -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
  <!-- Font Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase Compatibility SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex flex-col justify-between text-slate-800">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- Dynamic Modal Container -->
  <div id="modal-container" class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div id="modal-content" class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 transform transition-all scale-95 opacity-0 max-h-[90vh] overflow-y-auto"></div>
  </div>

  <!-- HEADER / NAVBAR -->
  <header class="bg-[#0f4c42] text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        
        <!-- Logo & Judul Kiri -->
        <a href="../index.html" class="flex items-center gap-3">
          <img src="../aset/aip%201.png" alt="Logo AIP Cloud" class="w-12 h-12 object-contain drop-shadow" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2991/2991108.png';">
          <div>
            <h1 class="font-bold text-xl tracking-wider text-white">E - C B T &nbsp; A I P &nbsp; C L O U D</h1>
            <p class="text-[11px] text-emerald-200 tracking-wide font-medium">PORTAL GURU - KELOLA SOAL & NILAI UJIAN</p>
          </div>
        </a>

        <!-- Navigation Header -->
        <nav id="nav-menu" class="flex items-center gap-4 text-sm font-bold tracking-wider">
          <a href="../index.html" id="btn-nav-beranda" class="hover:text-amber-300 transition-colors">BERANDA</a>
          <button id="btn-nav-login" onclick="window.guruApp.openLoginModal()" class="text-amber-300 border-b-2 border-amber-300 pb-1">LOGIN GURU</button>
          
          <div id="guru-logged-badge" class="hidden flex items-center gap-3">
            <span id="txt-guru-name" class="text-xs font-bold text-amber-300 tracking-wider uppercase"></span>
            <button onclick="window.guruApp.logout()" class="flex items-center gap-1 text-xs font-bold text-rose-300 hover:text-white bg-rose-900/60 hover:bg-rose-900 px-3 py-1.5 rounded-lg transition-all border border-rose-700">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
              KELUAR
            </button>
          </div>
        </nav>

      </div>
    </div>
  </header>

  <!-- MAIN DYNAMIC CONTENT -->
  <main id="app-view" class="flex-grow flex items-center justify-center p-6 sm:p-12">
    <!-- Diisi via JS -->
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-300 py-6 text-center shadow-inner">
    <div class="max-w-7xl mx-auto px-4 flex flex-col items-center justify-center gap-2">
      <img src="../aset/mts.png" alt="Logo MTs Al Ishlah Panambangan" class="w-10 h-10 object-contain" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2991/2991108.png';">
      <p class="text-xs sm:text-sm font-bold text-slate-700 tracking-wider uppercase">
        AIP CLOUD – MTS AL ISHLAH PANAMBANGAN @ 2026 – APLIKASI UJIAN BERBASIS KOMPUTER
      </p>
    </div>
  </footer>

  <script>
    // Firebase Realtime Database
    const firebaseConfig = {
      apiKey: "AIzaSyAQlu_WVDBVlmSg4C83euSkEs-SbaxbBbU",
      authDomain: "ecbt-aipcloud.firebaseapp.com",
      databaseURL: "https://ecbt-aipcloud-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ecbt-aipcloud",
      storageBucket: "ecbt-aipcloud.firebasestorage.app",
      messagingSenderId: "810156327221",
      appId: "1:810156327221:web:7bf52383c0d89fac228c7c",
      measurementId: "G-0JP7K0DFY7"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const dbRealtime = firebase.database();

    let cacheData = null;

    class DBController {
      static initListener(callback) {
        dbRealtime.ref('cbt_db').on('value', (snapshot) => {
          cacheData = snapshot.val() || {};
          if (!cacheData.teachers) cacheData.teachers = [];
          if (!cacheData.questions) cacheData.questions = [];
          if (!cacheData.examResults) cacheData.examResults = [];
          if (callback) callback();
        });
      }

      static get() {
        return cacheData || { teachers: [], questions: [], examResults: [] };
      }

      static save(data) {
        cacheData = data;
        dbRealtime.ref('cbt_db').set(data);
      }
    }

    class GuruApp {
      constructor() {
        this.activeTab = 'soal';
        this.activeGuru = null;
        DBController.initListener(() => this.render());
      }

      get db() { return DBController.get(); }
      saveDB(data) { DBController.save(data); }

      showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `p-4 rounded-xl shadow-lg text-white text-xs font-bold transition-all duration-300 ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`;
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }

      showModal(html) {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.innerHTML = html;
        container.classList.remove('hidden');
        setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
      }

      closeModal() {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => container.classList.add('hidden'), 200);
      }

      openLoginModal() {
        this.showModal(`
          <div class="space-y-4">
            <div class="text-center">
              <div class="inline-flex bg-emerald-100 p-3 rounded-2xl text-[#0f4c42] mb-2">
                <i data-lucide="user-check" class="w-6 h-6"></i>
              </div>
              <h3 class="font-bold text-slate-900 text-lg">Login Guru Pengampu</h3>
              <p class="text-xs text-slate-500">Masukkan Username & Password Akun Guru Anda</p>
            </div>

            <form onsubmit="window.guruApp.handleLogin(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username Guru</label>
                <input type="text" id="g-user" required placeholder="syihabadaw" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="g-pass" required value="123" placeholder="Password" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.guruApp.closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-[#0f4c42] hover:bg-[#0d3b36]">Masuk Portal Guru</button>
              </div>
            </form>
          </div>
        `);
        if (window.lucide) lucide.createIcons();
      }

      handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('g-user').value.trim();
        const p = document.getElementById('g-pass').value.trim();
        const db = this.db;

        const guru = (db.teachers || []).find(t => t.username === u && (t.password || '123') === p);

        if (guru) {
          this.activeGuru = guru;
          this.closeModal();
          this.showToast(`Login Berhasil! Selamat datang ${guru.name}`);
          this.render();
        } else {
          this.showToast('Username atau Password Guru salah!', 'error');
        }
      }

      logout() {
        this.activeGuru = null;
        this.showToast('Berhasil keluar');
        this.render();
      }

      setTab(tab) {
        this.activeTab = tab;
        this.render();
      }

      render() {
        const appView = document.getElementById('app-view');
        const btnNavLogin = document.getElementById('btn-nav-login');
        const btnNavBeranda = document.getElementById('btn-nav-beranda');
        const guruBadge = document.getElementById('guru-logged-badge');

        if (this.activeGuru) {
          btnNavLogin.classList.add('hidden');
          btnNavBeranda.classList.add('hidden');
          guruBadge.classList.remove('hidden');
          document.getElementById('txt-guru-name').innerText = this.activeGuru.name;

          appView.className = "flex-grow max-w-5xl w-full mx-auto p-4 sm:p-8 space-y-6";
          appView.innerHTML = this.renderGuruDashboard();
        } else {
          btnNavLogin.classList.remove('hidden');
          btnNavBeranda.classList.remove('hidden');
          guruBadge.classList.add('hidden');

          appView.className = "flex-grow flex items-center justify-center p-6 sm:p-12";
          appView.innerHTML = this.renderGuruHero();
        }

        if (window.MathJax) MathJax.typesetPromise();
        if (window.lucide) lucide.createIcons();
      }

      renderGuruHero() {
        return `
          <div class="text-center max-w-4xl mx-auto space-y-6">
            <h2 class="font-hero text-4xl sm:text-5xl md:text-6xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              Selamat Datang
            </h2>
            <h3 class="font-hero text-3xl sm:text-4xl md:text-5xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              BAPAK / IBU GURU DI
            </h3>
            <h1 class="font-hero text-4xl sm:text-6xl md:text-7xl font-black text-slate-900 leading-tight uppercase tracking-wider drop-shadow-sm">
              E-CBT AIP CLOUD
            </h1>
            <p class="font-hero text-lg sm:text-2xl md:text-3xl font-extrabold text-slate-800 tracking-widest pt-4">
              PORTAL KELOLA SOAL & ANALISIS NILAI UJIAN
            </p>
            <div class="pt-8">
              <button onclick="window.guruApp.openLoginModal()" class="bg-[#0f4c42] hover:bg-[#0d3b36] text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 text-sm uppercase tracking-wider">
                Klik Untuk Login Guru
              </button>
            </div>
          </div>
        `;
      }

      renderGuruDashboard() {
        const tab = this.activeTab;

        return `
          <!-- CAPSULE NAV TABS -->
          <div class="bg-white/80 p-2 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-center gap-2 flex-wrap max-w-xl mx-auto">
            <button onclick="window.guruApp.setTab('soal')" class="px-6 py-2 rounded-xl text-xs font-bold uppercase transition-all ${tab === 'soal' ? 'bg-slate-300/80 text-slate-800 shadow-inner' : 'bg-slate-200/50 text-slate-600 hover:bg-slate-200'}">
              BANK SOAL
            </button>
            <button onclick="window.guruApp.setTab('nilai')" class="px-6 py-2 rounded-xl text-xs font-bold uppercase transition-all ${tab === 'nilai' ? 'bg-slate-300/80 text-slate-800 shadow-inner' : 'bg-slate-200/50 text-slate-600 hover:bg-slate-200'}">
              HASIL UJIAN & KOREKSI
            </button>
          </div>

          <!-- TAB CONTENT -->
          ${tab === 'soal' ? this.renderTabSoalContent() : ''}
          ${tab === 'nilai' ? this.renderTabNilaiContent() : ''}
        `;
      }

      renderTabSoalContent() {
        const db = this.db;
        const questions = db.questions || [];

        return `
          <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-bold text-slate-900 text-sm">Kelola Bank Soal Realtime</h3>
                <p class="text-xs text-slate-500">Total Soal Terinput: <b>${questions.length} Soal</b></p>
              </div>
              <button onclick="window.guruApp.openAddSoalModal()" class="bg-[#0f4c42] hover:bg-[#0d3b36] text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1">
                <i data-lucide="plus" class="w-4 h-4"></i> Tambah Soal Baru
              </button>
            </div>

            <div class="space-y-3">
              ${questions.map((q, idx) => `
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-200 space-y-2 text-xs">
                  <div class="flex justify-between items-center border-b border-slate-200 pb-2">
                    <span class="font-bold text-[#0f4c42]">Soal No. ${idx + 1} (${q.type.replace('_', ' ').toUpperCase()})</span>
                    <div class="flex items-center gap-2">
                      <span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px]">Bobot: ${q.score || 20}</span>
                      <button onclick="window.guruApp.deleteSoal('${q.id}')" class="text-rose-600 hover:text-rose-800 font-bold">Hapus</button>
                    </div>
                  </div>
                  <div class="font-medium text-slate-800">${q.text}</div>${q.imageUrl ? `<img src="${q.imageUrl}" class="max-h-32 rounded border my-1">` : ''}
                </div>
              `).join('')}
              ${questions.length === 0 ? `<p class="text-xs text-slate-400 text-center py-6">Belum ada soal. Klik 'Tambah Soal Baru' untuk mengisi.</p>` : ''}
            </div>
          </div>
        `;
      }

      openAddSoalModal() {
        this.showModal(`
          <div class="space-y-4">
            <h3 class="font-bold text-slate-900 text-sm">Tambah Soal Ujian Baru</h3>
            <form onsubmit="window.guruApp.saveSoal(event)" class="space-y-3 text-xs">
              <div>
                <label class="block font-bold text-slate-700 mb-1">Tipe Soal</label>
                <select id="q-type" onchange="window.guruApp.toggleSoalFormFields(this.value)" class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none font-bold">
                  <option value="pg_tunggal">Pilihan Ganda Tunggal</option>
                  <option value="pg_kompleks">Pilihan Ganda Kompleks (Banyak Jawaban)</option>
                  <option value="benar_salah">Benar / Salah</option>
                  <option value="esai">Esai / Uraian</option>
                </select>
              </div>

              <div>
                <label class="block font-bold text-slate-700 mb-1">Pertanyaan / Teks Soal (Dukung Rumus MathJax: \\(x^2\\))</label>
                <textarea id="q-text" rows="3" required placeholder="Tuliskan soal di sini..." class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none"></textarea>
              </div>

              <div>
                <label class="block font-bold text-slate-700 mb-1">URL Gambar Soal (Opsional)</label>
                <input type="text" id="q-img" placeholder="https://..." class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>

              <div id="container-options" class="space-y-2">
                <label class="block font-bold text-slate-700 mb-1">Pilihan Jawaban (Pisahkan Komma)</label>
                <input type="text" id="q-opts" placeholder="RAM, CPU, Harddisk, Power Supply" class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>

              <div id="container-answer">
                <label class="block font-bold text-slate-700 mb-1">Kunci Jawaban Tepat</label>
                <input type="text" id="q-ans" placeholder="CPU" class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>

              <div>
                <label class="block font-bold text-slate-700 mb-1">Bobot Score Soal</label>
                <input type="number" id="q-score" value="20" required class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none font-bold">
              </div>

              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.guruApp.closeModal()" class="px-4 py-2 rounded-xl font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl font-bold text-white bg-[#0f4c42]">Simpan Soal ke Cloud</button>
              </div>
            </form>
          </div>
        `);
      }

      toggleSoalFormFields(type) {
        const cOpts = document.getElementById('container-options');
        const cAns = document.getElementById('container-answer');
        if (type === 'esai') {
          if (cOpts) cOpts.classList.add('hidden');
          if (cAns) cAns.classList.add('hidden');
        } else {
          if (cOpts) cOpts.classList.remove('hidden');
          if (cAns) cAns.classList.remove('hidden');
        }
      }

      saveSoal(e) {
        e.preventDefault();
        const db = this.db;
        if (!db.questions) db.questions = [];

        const type = document.getElementById('q-type').value;
        const text = document.getElementById('q-text').value.trim();
        const imageUrl = document.getElementById('q-img').value.trim();
        const score = parseFloat(document.getElementById('q-score').value) || 20;

        let options = [];
        let answer = '';

        if (type !== 'esai') {
          const rawOpts = document.getElementById('q-opts').value.trim();
          options = rawOpts ? rawOpts.split(',').map(s => s.trim()) : [];
          answer = document.getElementById('q-ans').value.trim();
        }

        db.questions.push({
          id: 'Q' + Date.now(),
          type,
          text,
          imageUrl,
          options,
          answer,
          score
        });

        this.saveDB(db);
        this.closeModal();
        this.showToast('Soal baru berhasil tersimpan ke Cloud Realtime!');
        this.render();
      }

      deleteSoal(qId) {
        const db = this.db;
        db.questions = (db.questions || []).filter(q => q.id !== qId);
        this.saveDB(db);
        this.showToast('Soal dihapus!');
        this.render();
      }

      renderTabNilaiContent() {
        const db = this.db;
        const results = db.examResults || [];

        return `
          <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
            <h3 class="font-bold text-slate-900 text-sm">Hasil Ujian Siswa (Live Realtime)</h3>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-700">
                <thead class="bg-slate-100 font-bold text-slate-800 uppercase">
                  <tr>
                    <th class="p-3 rounded-l-xl">Siswa</th>
                    <th class="p-3">Kelas</th>
                    <th class="p-3">Mapel</th>
                    <th class="p-3">Skor PG</th>
                    <th class="p-3">Skor Esai</th>
                    <th class="p-3">Total Nilai</th>
                    <th class="p-3 rounded-r-xl text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${results.map((r, idx) => `
                    <tr>
                      <td class="p-3 font-bold text-slate-900">${r.studentName}</td>
                      <td class="p-3">Kelas ${r.grade}</td>
                      <td class="p-3 font-medium">${r.subject}</td>
                      <td class="p-3 font-bold text-emerald-700">${r.pgScore || 0}</td>
                      <td class="p-3 font-bold text-amber-700">${r.essayScore || 0}</td>
                      <td class="p-3"><span class="bg-emerald-100 text-emerald-900 font-black px-2 py-1 rounded text-xs">${(r.pgScore || 0) + (r.essayScore || 0)}</span></td>
                      <td class="p-3 text-right">
                        <button onclick="window.guruApp.openKoreksiModal(${idx})" class="bg-[#0f4c42] text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">
                          Koreksi Esai
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
              ${results.length === 0 ? `<p class="text-xs text-slate-400 text-center py-6">Belum ada hasil ujian masuk dari siswa.</p>` : ''}
            </div>
          </div>
        `;
      }

      openKoreksiModal(resIdx) {
        const db = this.db;
        const res = db.examResults[resIdx];
        if (!res) return;

        this.showModal(`
          <div class="space-y-4 text-xs">
            <h3 class="font-bold text-slate-900 text-sm">Koreksi Esai: ${res.studentName}</h3>
            
            <form onsubmit="window.guruApp.saveKoreksi(event, ${resIdx})" class="space-y-3">
              <div>
                <label class="block font-bold text-slate-700 mb-1">Input Nilai Tambahan Esai (0 - 100)</label>
                <input type="number" id="essay-score-input" value="${res.essayScore || 0}" min="0" max="100" required class="w-full p-2.5 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-[#0f4c42]">
              </div>

              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.guruApp.closeModal()" class="px-4 py-2 rounded-xl font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl font-bold text-white bg-[#0f4c42]">Simpan Nilai Realtime</button>
              </div>
            </form>
          </div>
        `);
      }

      saveKoreksi(e, resIdx) {
        e.preventDefault();
        const db = this.db;
        const score = parseFloat(document.getElementById('essay-score-input').value) || 0;
        
        if (db.examResults[resIdx]) {
          db.examResults[resIdx].essayScore = score;
          db.examResults[resIdx].totalScore = (db.examResults[resIdx].pgScore || 0) + score;
          this.saveDB(db);
          this.showToast('Nilai Esai Berhasil Diperbarui!');
        }
        this.closeModal();
        this.render();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.guruApp = new GuruApp();
    });
  </script>
</body>
</html>
