<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Guru - E-CBT AIP CLOUD</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- MathJax CDN untuk Render Rumus Matematika/IPA -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
  <!-- Font Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex flex-col justify-between text-slate-800">

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- Dynamic Modal Container -->
  <div id="modal-container" class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div id="modal-content" class="bg-white rounded-2xl shadow-2xl max-w-3xl w-full p-6 transform transition-all scale-95 opacity-0 max-h-[90vh] overflow-y-auto"></div>
  </div>

  <!-- Hidden File Input Import Soal -->
  <input type="file" id="import-soal-file" accept=".csv, .txt" class="hidden" onchange="window.guruApp.handleImportSoal(event)">

  <!-- HEADER / NAVBAR -->
  <header class="bg-[#0f4c42] text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        
        <!-- Logo & Judul Kiri -->
        <a href="../index.html" class="flex items-center gap-3">
          <img src="../aset/mts.png" alt="Logo Kemenag" class="w-12 h-12 object-contain drop-shadow" onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/thumb/a/a2/Logo_Kementerian_Agama_Republik_Indonesia_new_version.png/600px-Logo_Kementerian_Agama_Republik_Indonesia_new_version.png';">
          <div>
            <h1 class="font-bold text-xl tracking-wider text-white">E - C B T &nbsp; A I P &nbsp; C L O U D</h1>
            <p class="text-[11px] text-emerald-200 tracking-wide font-medium">PANEL GURU - BANK SOAL & PENILAIAN</p>
          </div>
        </a>

        <!-- Header Navigation Actions -->
        <div class="flex items-center gap-4 text-sm font-bold">
          <a href="../index.html" id="btn-nav-beranda" class="hover:text-amber-300 transition-colors">BERANDA</a>
          <button id="btn-nav-login" onclick="window.guruApp.openLoginModal()" class="text-amber-300 border-b-2 border-amber-300 pb-1">LOGIN GURU</button>
          
          <div id="guru-logged-badge" class="hidden flex items-center gap-3">
            <span id="txt-guru-name" class="text-xs font-bold text-amber-300 uppercase py-1 px-2 bg-emerald-900/80 rounded border border-emerald-700"></span>
            <button onclick="window.guruApp.logout()" class="flex items-center gap-1 text-xs font-bold text-rose-300 hover:text-white bg-rose-900/60 hover:bg-rose-900 px-3 py-1.5 rounded-lg transition-all border border-rose-700">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i> KELUAR
            </button>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- MAIN DYNAMIC VIEW -->
  <main id="app-view" class="flex-grow flex items-center justify-center p-6 sm:p-10">
    <!-- Content rendered via JS -->
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-300 py-6 text-center shadow-inner">
    <div class="max-w-7xl mx-auto px-4 flex flex-col items-center justify-center gap-2">
      <img src="../aset/aip 1.png" alt="Logo MTs Al Ishlah Panambangan" class="w-10 h-10 object-contain" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2991/2991108.png';">
      <p class="text-xs sm:text-sm font-bold text-slate-700 tracking-wider uppercase">
        AIP CLOUD – MTS AL ISHLAH PANAMBANGAN @ 2026 – APLIKASI UJIAN BERBASIS KOMPUTER
      </p>
    </div>
  </footer>

  <script>
    const STORAGE_KEY = 'e_cbt_aip_cloud_db';

    const initialData = {
      activeTeacher: null,
      kkm: 75,
      examConfig: {
        isConfigured: false,
        selectedTypes: ['pg_tunggal', 'pg_kompleks', 'benar_salah', 'menjodohkan', 'esai'],
        counts: { pg_tunggal: 2, pg_kompleks: 1, benar_salah: 2, menjodohkan: 1, esai: 1 },
        weights: { pg_tunggal: 20, pg_kompleks: 20, benar_salah: 20, menjodohkan: 20, esai: 20 }
      },
      questions: [],
      examResults: [
        {
          studentId: '001',
          studentName: 'Muhammad Syihabuddin',
          grade: '7',
          subject: 'Informatika',
          pgScore: 60,
          essayAnswers: { 'Q1': 'Internet memudahkan siswa mencari materi referensi dan melakukan evaluasi CBT.' },
          essayScore: 20,
          totalScore: 80,
          isReleased: false
        }
      ]
    };

    class DBController {
      static get() {
        if (!localStorage.getItem(STORAGE_KEY)) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(initialData));
        }
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (!data.examConfig) data.examConfig = initialData.examConfig;
        if (!data.questions) data.questions = [];
        if (!data.examResults) data.examResults = initialData.examResults;
        if (!data.kkm) data.kkm = 75;
        return data;
      }

      static save(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      }
    }

    class GuruApp {
      constructor() {
        this.activeTab = 'bank_soal';
        this.render();
      }

      get db() { return DBController.get(); }
      saveDB(data) { DBController.save(data); }

      showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `p-4 rounded-xl shadow-lg text-white text-xs font-bold transition-all duration-300 ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`;
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }

      showModal(html) {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.innerHTML = html;
        container.classList.remove('hidden');
        setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
        if (window.MathJax) MathJax.typesetPromise();
        if (window.lucide) lucide.createIcons();
      }

      closeModal() {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => container.classList.add('hidden'), 200);
      }

      openLoginModal() {
        const db = this.db;
        const teachersList = db.teachers || [
          { username: 'syihabadaw', name: 'Muhammad Syihabuddin' },
          { username: 'naila32', name: 'Naila' }
        ];

        this.showModal(`
          <div class="space-y-4">
            <div class="text-center">
              <div class="inline-flex bg-emerald-100 p-3 rounded-2xl text-[#0f4c42] mb-2">
                <i data-lucide="user-check" class="w-6 h-6"></i>
              </div>
              <h3 class="font-bold text-slate-900 text-lg">Login Akun Guru</h3>
              <p class="text-xs text-slate-500">Pilih / Masukkan Kredensial Guru Pengampu</p>
            </div>

            <form onsubmit="window.guruApp.handleLogin(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username Guru</label>
                <input type="text" id="g-user" required list="teacher-options" placeholder="syihabadaw" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
                <datalist id="teacher-options">
                  ${teachersList.map(t => `<option value="${t.username}">${t.name}</option>`).join('')}
                </datalist>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="g-pass" required value="123" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.guruApp.closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-[#0f4c42] hover:bg-[#0d3b36]">Masuk Guru</button>
              </div>
            </form>
          </div>
        `);
      }

      handleLogin(e) {
        e.preventDefault();
        const username = document.getElementById('g-user').value.trim();
        const db = this.db;
        const teacher = (db.teachers || []).find(t => t.username === username) || { name: username, username: username };

        db.activeTeacher = teacher;
        this.saveDB(db);
        this.closeModal();
        this.showToast(`Selamat Datang, ${teacher.name}!`);
        this.render();
      }

      logout() {
        const db = this.db;
        db.activeTeacher = null;
        this.saveDB(db);
        this.showToast('Berhasil keluar dari sesi guru');
        this.render();
      }

      setTab(tab) {
        this.activeTab = tab;
        this.render();
      }

      render() {
        const appView = document.getElementById('app-view');
        const db = this.db;
        const btnNavLogin = document.getElementById('btn-nav-login');
        const guruBadge = document.getElementById('guru-logged-badge');
        const txtGuruName = document.getElementById('txt-guru-name');

        if (db.activeTeacher) {
          btnNavLogin.classList.add('hidden');
          guruBadge.classList.remove('hidden');
          txtGuruName.innerText = db.activeTeacher.name;

          appView.className = "flex-grow max-w-6xl w-full mx-auto p-4 sm:p-8 space-y-6";
          appView.innerHTML = this.renderGuruDashboard();
        } else {
          btnNavLogin.classList.remove('hidden');
          guruBadge.classList.add('hidden');

          appView.className = "flex-grow flex items-center justify-center p-6 sm:p-12";
          appView.innerHTML = this.renderHero();
        }

        if (window.MathJax) MathJax.typesetPromise();
        if (window.lucide) lucide.createIcons();
      }

      renderHero() {
        return `
          <div class="text-center max-w-4xl mx-auto space-y-6">
            <h2 class="font-hero text-4xl sm:text-5xl md:text-6xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              Selamat Datang
            </h2>
            <h3 class="font-hero text-3xl sm:text-4xl md:text-5xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              BAPAK / IBU GURU DI
            </h3>
            <h1 class="font-hero text-4xl sm:text-6xl md:text-7xl font-black text-slate-900 leading-tight uppercase tracking-wider drop-shadow-sm">
              E-CBT AIP CLOUD
            </h1>
            <p class="font-hero text-lg sm:text-2xl md:text-3xl font-extrabold text-slate-800 tracking-widest pt-4">
              KELOLA BANK SOAL, EVALUASI & RILIS NILAI Cepat
            </p>
            <div class="pt-8">
              <button onclick="window.guruApp.openLoginModal()" class="bg-[#0f4c42] hover:bg-[#0d3b36] text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 text-sm uppercase tracking-wider">
                Klik Untuk Login Guru
              </button>
            </div>
          </div>
        `;
      }

      renderGuruDashboard() {
        const tab = this.activeTab;
        return `
          <!-- CAPSULE NAV TABS -->
          <div class="bg-white/80 p-2 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-center gap-2 flex-wrap max-w-3xl mx-auto">
            <button onclick="window.guruApp.setTab('bank_soal')" class="px-5 py-2 rounded-xl text-xs font-bold uppercase transition-all ${tab === 'bank_soal' ? 'bg-[#0f4c42] text-white shadow' : 'bg-slate-200/50 text-slate-600 hover:bg-slate-200'}">
              <i data-lucide="file-text" class="w-3.5 h-3.5 inline mr-1"></i> BANK SOAL TERPADU
            </button>
            <button onclick="window.guruApp.setTab('penilaian')" class="px-5 py-2 rounded-xl text-xs font-bold uppercase transition-all ${tab === 'penilaian' ? 'bg-[#0f4c42] text-white shadow' : 'bg-slate-200/50 text-slate-600 hover:bg-slate-200'}">
              <i data-lucide="check-square" class="w-3.5 h-3.5 inline mr-1"></i> NILAI & ESAI
            </button>
            <button onclick="window.guruApp.setTab('analisis')" class="px-5 py-2 rounded-xl text-xs font-bold uppercase transition-all ${tab === 'analisis' ? 'bg-[#0f4c42] text-white shadow' : 'bg-slate-200/50 text-slate-600 hover:bg-slate-200'}">
              <i data-lucide="bar-chart-2" class="w-3.5 h-3.5 inline mr-1"></i> ANALISIS BUTIR SOAL
            </button>
          </div>

          <!-- TAB CONTENT -->
          ${tab === 'bank_soal' ? this.renderTabBankSoal() : ''}
          ${tab === 'penilaian' ? this.renderTabPenilaian() : ''}
          ${tab === 'analisis' ? this.renderTabAnalisis() : ''}
        `;
      }

      renderTabBankSoal() {
        const db = this.db;
        const config = db.examConfig;

        // BILA BELUM DIKONFIGURASI, TAMPILKAN STEP 1: PILIH JENIS SOAL & JUMLAH/BOBOT
        if (!config.isConfigured) {
          return this.renderStepSetupConfig();
        }

        // BILA SUDAH DIKONFIGURASI, TAMPILKAN PANEL UTAMA BANK SOAL
        return this.renderStepBankSoalMain();
      }

      // STEP 1: FORM KONFIGURASI JENIS SOAL, JUMLAH & BOBOT NILAI
      renderStepSetupConfig() {
        const db = this.db;
        const config = db.examConfig;

        const typesList = [
          { id: 'pg_tunggal', label: 'Pilihan Ganda (Tunggal)' },
          { id: 'pg_kompleks', label: 'Pilihan Ganda Kompleks' },
          { id: 'benar_salah', label: 'Benar / Salah' },
          { id: 'menjodohkan', label: 'Menjodohkan Pasangan' },
          { id: 'esai', label: 'Esai / Uraian' }
        ];

        return `
          <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm max-w-3xl mx-auto space-y-6">
            <div class="text-center border-b border-slate-200 pb-4">
              <span class="bg-emerald-100 text-emerald-800 text-[10px] font-black uppercase px-3 py-1 rounded-full tracking-wider">LANGKAH 1 DARI 2</span>
              <h3 class="font-bold text-slate-900 text-xl mt-2">Konfigurasi Struktur Soal Ujian</h3>
              <p class="text-xs text-slate-500">Pilih jenis soal yang akan digunakan, tentukan jumlah soal, dan atur bobot nilainya (Maksimal Total 100 Poin)</p>
            </div>

            <form onsubmit="window.guruApp.saveExamConfig(event)" class="space-y-5 text-xs">
              
              <!-- CHECKBOX PILIH JENIS SOAL -->
              <div>
                <label class="block font-extrabold text-slate-800 mb-2">1. Pilih Jenis Soal Yang Ingin Digunakan:</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  ${typesList.map(t => {
                    const isChecked = config.selectedTypes.includes(t.id);
                    return `
                      <label class="flex items-center gap-2 p-3 border border-slate-200 rounded-xl cursor-pointer hover:bg-slate-50 transition-colors ${isChecked ? 'bg-emerald-50/50 border-emerald-300' : ''}">
                        <input type="checkbox" name="type_choice" value="${t.id}" ${isChecked ? 'checked' : ''} onchange="window.guruApp.onTypeChoiceChange()" class="w-4 h-4 accent-[#0f4c42]">
                        <span class="font-bold text-slate-800">${t.label}</span>
                      </label>
                    `;
                  }).join('')}
                </div>
              </div>

              <!-- PENENTUAN JUMLAH & BOBOT PER JENIS SOAL -->
              <div id="section-counts-weights" class="space-y-3 pt-2">
                <!-- Rendered dynamically -->
              </div>

              <!-- AKUMULASI KALKULATOR SKOR -->
              <div class="p-4 rounded-2xl bg-slate-100 border border-slate-300 flex justify-between items-center">
                <div>
                  <p class="font-extrabold text-slate-800">Total Akumulasi Bobot Skor Ujian:</p>
                  <p class="text-[11px] text-slate-500">Akan dihitung otomatis dari (Jumlah Soal × Bobot per Soal)</p>
                </div>
                <div id="badge-total-score" class="text-lg font-black px-4 py-1.5 rounded-xl bg-emerald-800 text-white shadow">
                  100 / 100 POIN
                </div>
              </div>

              <div class="pt-2">
                <button type="submit" class="w-full bg-[#0f4c42] hover:bg-[#0d3b36] text-white py-3.5 rounded-xl font-bold uppercase tracking-wider text-xs shadow-lg transition-all">
                  Lanjut Ke Pembuatan Soal &rarr;
                </button>
              </div>
            </form>
          </div>
        `;
      }

      onTypeChoiceChange() {
        const checkboxes = document.querySelectorAll('input[name="type_choice"]:checked');
        const selected = Array.from(checkboxes).map(c => c.value);
        const container = document.getElementById('section-counts-weights');

        if (selected.length === 0) {
          container.innerHTML = `<p class="text-rose-600 font-bold">Pilih minimal 1 jenis soal!</p>`;
          return;
        }

        const labelsMap = {
          pg_tunggal: 'PG Tunggal',
          pg_kompleks: 'PG Kompleks',
          benar_salah: 'Benar / Salah',
          menjodohkan: 'Menjodohkan',
          esai: 'Esai / Uraian'
        };

        container.innerHTML = `
          <label class="block font-extrabold text-slate-800">2. Tentukan Jumlah Soal & Bobot Nilai Per Soal:</label>
          <div class="space-y-2">
            ${selected.map(tId => `
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 p-3 bg-slate-50 rounded-xl border border-slate-200 items-center">
                <span class="font-bold text-slate-800">${labelsMap[tId]}</span>
                <div>
                  <span class="text-[10px] text-slate-500">Jumlah Soal:</span>
                  <input type="number" id="count-${tId}" min="1" value="2" oninput="window.guruApp.calculateTotalScore()" class="w-full p-2 border border-slate-200 rounded-lg outline-none font-bold">
                </div>
                <div>
                  <span class="text-[10px] text-slate-500">Bobot Per Soal (Poin):</span>
                  <input type="number" id="weight-${tId}" min="1" value="10" oninput="window.guruApp.calculateTotalScore()" class="w-full p-2 border border-slate-200 rounded-lg outline-none font-bold">
                </div>
              </div>
            `).join('')}
          </div>
        `;

        this.calculateTotalScore();
      }

      calculateTotalScore() {
        const checkboxes = document.querySelectorAll('input[name="type_choice"]:checked');
        let grandTotal = 0;

        checkboxes.forEach(cb => {
          const tId = cb.value;
          const countInput = document.getElementById(`count-${tId}`);
          const weightInput = document.getElementById(`weight-${tId}`);

          if (countInput && weightInput) {
            const cnt = parseFloat(countInput.value) || 0;
            const wgt = parseFloat(weightInput.value) || 0;
            grandTotal += (cnt * wgt);
          }
        });

        const badge = document.getElementById('badge-total-score');
        if (badge) {
          badge.innerText = `${grandTotal} / 100 POIN`;
          if (grandTotal === 100) {
            badge.className = "text-lg font-black px-4 py-1.5 rounded-xl bg-emerald-800 text-white shadow";
          } else {
            badge.className = "text-lg font-black px-4 py-1.5 rounded-xl bg-amber-600 text-white shadow";
          }
        }
      }

      saveExamConfig(e) {
        e.preventDefault();
        const checkboxes = document.querySelectorAll('input[name="type_choice"]:checked');
        const selected = Array.from(checkboxes).map(c => c.value);

        if (selected.length === 0) {
          this.showToast('Pilih minimal 1 jenis soal!', 'error');
          return;
        }

        const counts = {};
        const weights = {};

        selected.forEach(tId => {
          counts[tId] = parseInt(document.getElementById(`count-${tId}`).value) || 1;
          weights[tId] = parseFloat(document.getElementById(`weight-${tId}`).value) || 10;
        });

        const db = this.db;
        db.examConfig = {
          isConfigured: true,
          selectedTypes: selected,
          counts,
          weights
        };

        this.saveDB(db);
        this.showToast('Konfigurasi soal disimpan!');
        this.render();
      }

      resetExamConfig() {
        if (confirm('Ubah konfigurasi akan mereset bank soal saat ini. Lanjutkan?')) {
          const db = this.db;
          db.examConfig.isConfigured = false;
          db.questions = [];
          this.saveDB(db);
          this.render();
        }
      }

      // STEP 2: PANEL UTAMA BANK SOAL (MANUAL ATAU TEMPLATE DOWLOAD/UPLOAD)
      renderStepBankSoalMain() {
        const db = this.db;
        const config = db.examConfig;
        const questions = db.questions || [];

        // Hitung Total Target Soal
        let targetTotalCount = 0;
        let targetTotalScore = 0;
        config.selectedTypes.forEach(t => {
          const cnt = config.counts[t] || 0;
          const wgt = config.weights[t] || 0;
          targetTotalCount += cnt;
          targetTotalScore += (cnt * wgt);
        });

        return `
          <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
            
            <!-- HEADER CONFIG SUMMARY & ACTION BUTTONS -->
            <div class="flex justify-between items-center flex-wrap gap-4 border-b border-slate-200 pb-4">
              <div>
                <div class="flex items-center gap-2">
                  <h3 class="font-bold text-slate-900 text-base">Bank Soal Terpadu</h3>
                  <button onclick="window.guruApp.resetExamConfig()" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-2 py-0.5 rounded font-bold border">Ubah Struktur</button>
                </div>
                <p class="text-xs text-slate-500">Target Soal: <b>${targetTotalCount} Nomor</b> | Total Bobot: <b>${targetTotalScore} Poin</b></p>
              </div>

              <div class="flex items-center gap-2 flex-wrap">
                <!-- DOWNLOAD TEMPLATE WORD/CSV TERKONFIGURASI -->
                <button onclick="window.guruApp.downloadConfiguredTemplate()" class="bg-blue-50 hover:bg-blue-100 text-blue-800 border border-blue-300 px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
                  <i data-lucide="download" class="w-4 h-4"></i> Download Template Soal (Word)
                </button>

                <!-- UNGGAH TEMPLATE TERISI -->

      // UNDUH TEMPLATE WORD DENGAN STRUKTUR DARI STEP 1
      downloadConfiguredTemplate() {
        const db = this.db;
        const config = db.examConfig;

        let tableRows = '';
        let no = 1;

        config.selectedTypes.forEach(tId => {
          const count = config.counts[tId] || 1;
          const weight = config.weights[tId] || 10;

          for (let i = 0; i < count; i++) {
            let sampleOpt = '';
            let sampleAns = '';

            if (tId === 'pg_tunggal') {
              sampleOpt = 'A. Pilihan 1 | B. Pilihan 2 | C. Pilihan 3 | D. Pilihan 4';
              sampleAns = 'A. Pilihan 1';
            } else if (tId === 'pg_kompleks') {
              sampleOpt = 'A. Pilihan 1 | B. Pilihan 2 | C. Pilihan 3 | D. Pilihan 4';
              sampleAns = 'A. Pilihan 1 | C. Pilihan 3';
            } else if (tId === 'benar_salah') {
              sampleOpt = 'Benar | Salah';
              sampleAns = 'Benar';
            } else if (tId === 'menjodohkan') {
              sampleOpt = 'Hardware = Perangkat Keras, Software = Perangkat Lunak';
              sampleAns = 'Format Pasangan';
            } else {
              sampleOpt = '-';
              sampleAns = 'Uraian Mandiri';
            }

            tableRows += `
              <tr>
                <td>${no++}</td>
                <td><b>${tId}</b></td>
                <td>Tulis pertanyaan nomor ${no-1} di sini... (MathJax: \\( x^2 \\))</td>
                <td></td>
                <td>${sampleOpt}</td>
                <td>${sampleAns}</td>
                <td>${weight}</td>
              </tr>
            `;
          }
        });

        const docContent = `
          <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
          <head><title>Template Soal Ujian</title>
          <style>
            body { font-family: Arial, sans-serif; }
            table { border-collapse: collapse; width: 100%; margin-top: 10px; }
            th, td { border: 1px solid #000; padding: 6px; text-align: left; font-size: 11px; }
            th { background-color: #f2f2f2; }
          </style>
          </head>
          <body>
            <h2>TEMPLATE IMPORT SOAL E-CBT AIP CLOUD</h2>
            <p><b>Petunjuk:</b> Isilah pertanyaan dan kunci jawaban pada tabel di bawah ini tanpa mengubah kolom Jenis Soal dan No.</p>
            
            <table>
              <tr>
                <th>No</th>
                <th>Jenis Soal</th>
                <th>Pertanyaan / Teks Soal</th>
                <th>URL Gambar (Opsional)</th>
                <th>Pilihan / Pasangan</th>
                <th>Kunci Jawaban</th>
                <th>Bobot</th>
              </tr>
              ${tableRows}
            </table>
          </body>
          </html>
        `;

        const blob = new Blob(['\ufeff' + docContent], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Template_Soal_Terkonfigurasi.doc';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        this.showToast('Template Word terkonfigurasi diunduh!');
      }

      // IMPOR / UNGGAH TEMPLATE SOAL
      triggerImportSoal() {
        document.getElementById('import-soal-file').click();
      }

      handleImportSoal(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const lines = evt.target.result.split(/\r\n|\n/);
          const db = this.db;
          const config = db.examConfig;
          let addedCount = 0;

          lines.forEach((line, index) => {
            if (index === 0 || !line.trim()) return;
            const cols = line.split(',').map(c => c.trim().replace(/^"|"$/g, ''));
            if (cols.length >= 3) {
              const type = cols[1] || 'pg_tunggal';
              const text = cols[2];
              const imageUrl = cols[3] || '';
              const rawOpt = cols[4] || '';
              const rawAns = cols[5] || '';
              const score = parseFloat(cols[6]) || (config.weights[type] || 10);

              if (text) {
                const newQ = { id: 'Q' + Date.now() + Math.random(), type, text, imageUrl, score };
                if (type === 'pg_tunggal' || type === 'benar_salah') {
                  newQ.options = rawOpt ? rawOpt.split('|').map(s => s.trim()) : ['A', 'B', 'C', 'D'];
                  newQ.answer = rawAns.trim();
                } else if (type === 'pg_kompleks') {
                  newQ.options = rawOpt ? rawOpt.split('|').map(s => s.trim()) : ['A', 'B', 'C', 'D'];
                  newQ.answer = rawAns.split('|').map(s => s.trim());
                } else if (type === 'menjodohkan') {
                  newQ.pairs = rawOpt.split(',').map(p => {
                    const [l, r] = p.split('=');
                    return { left: (l || '').trim(), right: (r || '').trim() };
                  });
                }

                db.questions.push(newQ);
                addedCount++;
              }
            }
          });

          this.saveDB(db);
          this.showToast(`Berhasil mengimpor ${addedCount} soal!`);
          this.render();
          e.target.value = '';
        };
        reader.readAsText(file);
      }

      saveManualQuestion(e) {
        e.preventDefault();
        const db = this.db;
        const config = db.examConfig;

        const type = document.getElementById('m-type').value;
        const text = document.getElementById('m-text').value.trim();
        const imageUrl = document.getElementById('m-img').value.trim();
        const score = config.weights[type] || 10;

        const newQ = { id: 'Q' + Date.now(), type, text, imageUrl, score };

        if (type === 'pg_tunggal') {
          newQ.options = document.getElementById('m-options').value.split('|').map(s => s.trim());
          newQ.answer = document.getElementById('m-ans').value.trim();
        } else if (type === 'pg_kompleks') {
          newQ.options = document.getElementById('m-options').value.split('|').map(s => s.trim());
          newQ.answer = document.getElementById('m-ans').value.split('|').map(s => s.trim());
        } else if (type === 'benar_salah') {
          newQ.options = ['Benar', 'Salah'];
          newQ.answer = document.getElementById('m-ans-bs').value;
        } else if (type === 'menjodohkan') {
          const raw = document.getElementById('m-pairs').value.split(',');
          newQ.pairs = raw.map(p => {
            const [l, r] = p.split('=');
            return { left: (l || '').trim(), right: (r || '').trim() };
          });
        }

        db.questions.push(newQ);
        this.saveDB(db);
        this.closeModal();
        this.showToast('Soal manual disimpan!');
        this.render();
      }

        const db = this.db;
        db.questions = db.questions.filter(q => q.id !== id);
        this.saveDB(db);
        this.showToast('Soal dihapus!');
        this.render();

        <tbody>
  `;

  results.forEach((r, idx) => {
    const status = r.totalScore >= kkm ? 'LULUS' : 'REMIDI';
    tableContent += `
      <tr>
        <td class="center">${idx + 1}</td>
        <td class="bold">${r.studentName}</td>
        <td class="center">Kelas ${r.grade}</td>
        <td class="center bold">${r.totalScore}</td>
        <td class="center" style="color: ${r.totalScore >= kkm ? '#047857' : '#b91c1c'}; font-weight: bold;">${status}</td>
      </tr>
    `;
  });

  tableContent += `
        </tbody>
      </table>
    </body>
    </html>
  `;

  const blob = new Blob(['\ufeff' + tableContent], { type: 'application/vnd.ms-excel' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.setAttribute("href", url);
  link.setAttribute("download", `Laporan_Nilai_Siswa.xls`);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  this.showToast('Laporan Nilai Excel berhasil diunduh!');
}

      renderTabAnalisis() {
        const db = this.db;
        const questions = db.questions || [];

        return `
          <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
            <div>
              <h3 class="font-bold text-slate-900 text-base">Visual Analisis Butir Soal</h3>
              <p class="text-xs text-slate-500">Persentase tingkat kesulitan dan ketepatan jawaban siswa per nomor soal</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${questions.map((q, idx) => {
                const percentCorrect = [85, 90, 70, 60, 75][idx % 5];
                return `
                  <div class="p-4 border border-slate-200 rounded-2xl bg-slate-50 space-y-2">
                    <div class="flex justify-between items-center text-xs">
                      <span class="font-bold text-slate-800">Nomor Soal ${idx + 1} (${q.type})</span>
                      <span class="font-black text-emerald-700">${percentCorrect}% Benar</span>
                    </div>
                    
                    <div class="w-full h-3 bg-slate-200 rounded-full overflow-hidden">
                      <div class="h-full bg-emerald-600 rounded-full" style="width: ${percentCorrect}%"></div>
                    </div>

                    <p class="text-[11px] text-slate-500">Tingkat Kesulitan: <b>${percentCorrect > 75 ? 'Mudah' : percentCorrect > 50 ? 'Sedang' : 'Sukar'}</b></p>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.guruApp = new GuruApp();
    });
  </script>
