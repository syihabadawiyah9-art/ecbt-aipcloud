<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- MathJax CDN -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
  <!-- Mammoth JS (Untuk Membaca File Word .docx di Browser) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- SheetJS (Untuk Export File Excel .xlsx) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- Font Serif Display & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase Compatibility SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-hero { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex flex-col justify-between text-slate-800">

  <!-- Toast Notification Container -->

  <!-- Modal Container -->
  <div id="modal-container" class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div id="modal-content" class="bg-white rounded-3xl shadow-2xl max-w-2xl w-full p-6 sm:p-8 transform transition-all scale-95 opacity-0 max-h-[90vh] overflow-y-auto"></div>
  </div>

  <!-- Hidden File Input untuk Microsoft Word (.docx) -->
  <input type="file" id="import-soal-doc" accept=".docx" class="hidden" onchange="window.guruApp.handleUploadDocxTemplate(event)">

  <!-- HEADER / NAVBAR -->
  <header class="bg-[#0f4c42] text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        
        <a href="../index.html" class="flex items-center gap-3">
          <img src="../aset/mts.png" alt="Logo AIP Cloud" class="w-12 h-12 object-contain drop-shadow" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2991/2991108.png';">
          <div>
            <h1 class="font-hero font-black text-xl sm:text-2xl tracking-wider text-white">E - C B T &nbsp; A I P &nbsp; C L O U D</h1>
            <p class="text-[10px] sm:text-[11px] text-emerald-200 tracking-wide font-medium">PORTAL GURU - KELOLA SOAL & NILAI UJIAN</p>
          </div>
        </a>

        <nav id="nav-menu" class="flex items-center gap-4 text-sm font-bold tracking-wider">
          <a href="../index.html" id="btn-nav-beranda" class="hover:text-amber-300 transition-colors">BERANDA</a>
          <button id="btn-nav-login" onclick="window.guruApp.openLoginModal()" class="text-amber-300 border-b-2 border-amber-300 pb-1">LOGIN GURU</button>
          
          <div id="guru-logged-badge" class="hidden flex items-center gap-3">
            <span id="txt-guru-name" class="text-xs font-bold text-amber-300 tracking-wider uppercase"></span>
            <button onclick="window.guruApp.logout()" class="flex items-center gap-1 text-xs font-bold text-rose-300 hover:text-white bg-rose-900/60 hover:bg-rose-900 px-3 py-1.5 rounded-lg transition-all border border-rose-700">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i> KELUAR
            </button>
          </div>
        </nav>

      </div>
    </div>
  </header>

  <!-- MAIN DYNAMIC CONTENT -->
  <main id="app-view" class="flex-grow flex items-center justify-center p-4 sm:p-8">
    <!-- Rendered via JavaScript -->
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-300 py-6 text-center shadow-inner">
    <div class="max-w-7xl mx-auto px-4 flex flex-col items-center justify-center gap-2">
      <img src="../aset/aip%201.png" alt="Logo MTs Al Ishlah Panambangan" class="w-10 h-10 object-contain" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2991/2991108.png';">
      <p class="text-xs sm:text-sm font-bold text-slate-700 tracking-wider uppercase">
        AIP CLOUD – MTS AL ISHLAH PANAMBANGAN @ 2026 – APLIKASI UJIAN BERBASIS KOMPUTER
      </p>
    </div>
  </footer>

  <script>
    // Firebase Realtime Database
    const firebaseConfig = {
      apiKey: "AIzaSyAQlu_WVDBVlmSg4C83euSkEs-SbaxbBbU",
      authDomain: "ecbt-aipcloud.firebaseapp.com",
      databaseURL: "https://ecbt-aipcloud-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ecbt-aipcloud",
      storageBucket: "ecbt-aipcloud.firebasestorage.app",
      messagingSenderId: "810156327221",
      appId: "1:810156327221:web:7bf52383c0d89fac228c7c",
      measurementId: "G-0JP7K0DFY7"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const dbRealtime = firebase.database();

    let cacheData = null;

    class DBController {
      static initListener(callback) {
        dbRealtime.ref('cbt_db').on('value', (snapshot) => {
          cacheData = snapshot.val() || {};
          if (!cacheData.teachers) cacheData.teachers = [];
          if (!cacheData.questions) cacheData.questions = [];
          if (!cacheData.examResults) cacheData.examResults = [];
          if (callback) callback();
        });
      }

      static get() {
        return cacheData || { teachers: [], questions: [], examResults: [] };
      }

      static save(data) {
        cacheData = data;
        dbRealtime.ref('cbt_db').set(data);
      }
    }

    class GuruApp {
      constructor() {
        this.activeGuru = null;
        this.selectedSubject = null;
        this.selectedGrade = null;
        this.classTab = 'soal';
        
        this.generatedSlots = []; 
        this.creationMode = null;
        this.isRandomQuestions = false;
        this.isRandomOptions = false;

        DBController.initListener(() => this.render());
      }

      get db() { return DBController.get(); }
      saveDB(data) { DBController.save(data); }

      showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `p-4 rounded-xl shadow-lg text-white text-xs font-bold transition-all duration-300 ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`;
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }

      openLoginModal() {
        this.showModal(`
          <div class="space-y-4">
            <div class="text-center">
              <div class="inline-flex bg-emerald-100 p-3 rounded-2xl text-[#0f4c42] mb-2">
                <i data-lucide="user-check" class="w-6 h-6"></i>
              </div>
              <h3 class="font-bold text-slate-900 text-lg">Login Guru Pengampu</h3>
              <p class="text-xs text-slate-500">Masukkan Username & Password Akun Guru Anda</p>
            </div>

            <form onsubmit="window.guruApp.handleLogin(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username Guru</label>
                <input type="text" id="g-user" required placeholder="syihabadaw" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="g-pass" required value="123" placeholder="Password" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.guruApp.closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-[#0f4c42] hover:bg-[#0d3b36]">Masuk Portal Guru</button>
              </div>
            </form>
          </div>
        `);
        if (window.lucide) lucide.createIcons();
      }

      showModal(html) {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.innerHTML = html;
        container.classList.remove('hidden');
        setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
      }

      closeModal() {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => container.classList.add('hidden'), 200);
      }

      handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('g-user').value.trim();
        const p = document.getElementById('g-pass').value.trim();
        const db = this.db;

        const guru = (db.teachers || []).find(t => t.username === u && (t.password || '123') === p);

        if (guru) {
          this.activeGuru = guru;
          this.selectedSubject = null;
          this.selectedGrade = null;
          this.closeModal();
          this.showToast(`Login Berhasil! Selamat datang ${guru.name}`);
          this.render();
        } else {
          this.showToast('Username atau Password Guru salah!', 'error');
        }
      }

      logout() {
        this.activeGuru = null;
        this.selectedSubject = null;
        this.selectedGrade = null;
        this.generatedSlots = [];
        this.showToast('Berhasil keluar');
        this.render();
      }

      render() {
        const appView = document.getElementById('app-view');
        const btnNavLogin = document.getElementById('btn-nav-login');
        const btnNavBeranda = document.getElementById('btn-nav-beranda');
        const guruBadge = document.getElementById('guru-logged-badge');

        if (this.activeGuru) {
          btnNavLogin.classList.add('hidden');
          btnNavBeranda.classList.add('hidden');
          guruBadge.classList.remove('hidden');
          document.getElementById('txt-guru-name').innerText = this.activeGuru.name;

          appView.className = "flex-grow max-w-6xl w-full mx-auto p-4 sm:p-6 space-y-6";

          if (!this.selectedSubject) {
            appView.innerHTML = this.renderDashboardUtama();
          } else if (this.selectedSubject && !this.selectedGrade) {
            appView.innerHTML = this.renderDaftarKelasView();
          } else if (this.selectedSubject && this.selectedGrade) {
            appView.innerHTML = this.renderMenuKelasView();
          }
        } else {
          btnNavLogin.classList.remove('hidden');
          btnNavBeranda.classList.remove('hidden');
          guruBadge.classList.add('hidden');

          appView.className = "flex-grow flex items-center justify-center p-6 sm:p-12";
          appView.innerHTML = this.renderGuruHero();
        }

        if (window.MathJax) MathJax.typesetPromise();
        if (window.lucide) lucide.createIcons();
      }

      renderGuruHero() {
        return `
          <div class="text-center max-w-4xl mx-auto space-y-6">
            <h2 class="font-hero text-4xl sm:text-5xl md:text-6xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              Selamat Datang
            </h2>
            <h3 class="font-hero text-3xl sm:text-4xl md:text-5xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              BAPAK / IBU GURU DI
            </h3>
            <h1 class="font-hero text-4xl sm:text-6xl md:text-7xl font-black text-slate-900 leading-tight uppercase tracking-wider drop-shadow-sm">
              E-CBT AIP CLOUD
            </h1>
            <p class="font-hero text-lg sm:text-2xl md:text-3xl font-extrabold text-slate-800 tracking-widest pt-4">
              PORTAL KELOLA SOAL & ANALISIS NILAI UJIAN
            </p>
            <div class="pt-8">
              <button onclick="window.guruApp.openLoginModal()" class="bg-[#0f4c42] hover:bg-[#0d3b36] text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 text-sm uppercase tracking-wider">
                Klik Untuk Login Guru
              </button>
            </div>
          </div>
        `;
      }

      // 1. DASHBOARD UTAMA GURU
      renderDashboardUtama() {
        const guru = this.activeGuru;
        const subjects = guru.subjects || ['Informatika', 'Tahsin'];

        return `
          <div class="space-y-6">
            
            <div class="text-xs font-bold text-slate-500 flex items-center gap-1">
              <span>Home</span> / <span class="text-[#0f4c42]">Dashboard Guru</span>
            </div>

            <!-- PROFIL GURU CARD -->
            <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm grid grid-cols-1 md:grid-cols-3 gap-6 items-center">
              <div class="flex flex-col items-center text-center p-4 bg-slate-50 rounded-2xl border border-slate-200">
                <div class="w-24 h-24 bg-emerald-100 text-[#0f4c42] rounded-full flex items-center justify-center mb-3 border-2 border-emerald-500 shadow-inner">
                  <i data-lucide="user" class="w-12 h-12"></i>
                </div>
                <h3 class="font-black text-slate-900 text-sm">${guru.name}</h3>
                <span class="text-[10px] font-bold text-emerald-800 bg-emerald-100 px-3 py-1 rounded-full mt-1">Guru Pengampu</span>
              </div>

              <div class="md:col-span-2 space-y-3 text-xs">
                <div class="flex justify-between border-b border-slate-100 pb-2">
                  <span class="text-slate-500 font-medium">Nama Lengkap:</span>
                  <span class="font-bold text-slate-900">${guru.name}</span>
                </div>
                <div class="flex justify-between border-b border-slate-100 pb-2">
                  <span class="text-slate-500 font-medium">NIP / NUPTK:</span>
                  <span class="font-mono font-bold text-slate-900">${guru.nuptk || '20244536196002'}</span>
                </div>
                <div class="flex justify-between border-b border-slate-100 pb-2">
                  <span class="text-slate-500 font-medium">Unit Kerja:</span>
                  <span class="font-bold text-slate-900">MTs Al Ishlah Panambangan</span>
                </div>
                <div class="flex justify-between border-b border-slate-100 pb-2">
                  <span class="text-slate-500 font-medium">Pendidikan Terakhir:</span>
                  <span class="font-bold text-slate-900">Sarjana (S1)</span>
                </div>
              </div>
            </div>

            <!-- MATA PELAJARAN YANG DIAMPU -->
            <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-4">
              <div class="border-b border-slate-200 pb-3 flex items-center gap-2">
                <i data-lucide="book-open" class="w-5 h-5 text-[#0f4c42]"></i>
                <h3 class="font-bold text-slate-900 text-sm uppercase tracking-wide">Mata Pelajaran Yang Diampu</h3>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                ${subjects.map(s => `
                  <div onclick="window.guruApp.pilihSubject('${s}')" class="bg-slate-50 hover:bg-emerald-50 p-5 rounded-2xl border border-slate-200 hover:border-emerald-400 cursor-pointer transition-all space-y-3 group shadow-sm">
                    <div class="flex justify-between items-center">
                      <div class="p-3 bg-emerald-100 text-[#0f4c42] rounded-xl group-hover:bg-[#0f4c42] group-hover:text-white transition-colors">
                        <i data-lucide="laptop" class="w-6 h-6"></i>
                      </div>
                      <span class="text-[10px] font-bold text-slate-400 group-hover:text-emerald-700">Mapel Aktif</span>
                    </div>
                    <div>
                      <h4 class="font-bold text-slate-900 text-sm group-hover:text-[#0f4c42]">${s}</h4>
                      <p class="text-[10px] text-slate-500">Klik untuk kelola kelas & bank soal</p>
                    </div>
                    <div class="text-[10px] font-bold text-[#0f4c42] flex items-center gap-1 group-hover:translate-x-1 transition-transform">
                      Buka Kelola Mapel &rarr;
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

          </div>
        `;
      }

      pilihSubject(subj) {
        this.selectedSubject = subj;
        this.selectedGrade = null;
        this.render();
      }

      // 2. DAFTAR KELAS SESUAI MAPEL
      renderDaftarKelasView() {
        const subj = this.selectedSubject;
        const classList = [
          { id: 'VII.A', label: 'Kelas VII.A' },
          { id: 'VII.B', label: 'Kelas VII.B' },
          { id: 'VIII.A', label: 'Kelas VIII.A' },
          { id: 'VIII.B', label: 'Kelas VIII.B' },
          { id: 'IX.A', label: 'Kelas IX.A' },
          { id: 'IX.B', label: 'Kelas IX.B' }
        ];

        return `
          <div class="space-y-6">
            
            <div class="flex justify-between items-center">
              <div class="text-xs font-bold text-slate-500 flex items-center gap-1">
                <button onclick="window.guruApp.selectedSubject=null; window.guruApp.render();" class="hover:underline">Dashboard</button> / 
                <span class="text-[#0f4c42]">${subj}</span>
              </div>

              <button onclick="window.guruApp.selectedSubject=null; window.guruApp.render();" class="text-xs font-bold text-slate-600 bg-white hover:bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 flex items-center gap-1">
                &larr; Kembali ke Dashboard
              </button>
            </div>

            <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
              <div class="border-b border-slate-200 pb-3">
                <span class="bg-emerald-100 text-emerald-900 text-[10px] font-black uppercase px-3 py-1 rounded-full">MAPEL: ${subj}</span>
                <h3 class="font-bold text-slate-900 text-base mt-2">Pilih Kelas Yang Diampu</h3>
                <p class="text-xs text-slate-500">Silakan pilih kelas untuk mengelola bank soal atau melihat rekap nilai ujian</p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                ${classList.map(c => `
                  <div onclick="window.guruApp.pilihGrade('${c.id}')" class="bg-slate-50 hover:bg-emerald-50 p-5 rounded-2xl border border-slate-200 hover:border-emerald-400 cursor-pointer transition-all space-y-3 group shadow-sm">
                    <div class="flex justify-between items-center">
                      <span class="font-black text-slate-800 text-sm group-hover:text-[#0f4c42]">${c.label}</span>
                      <i data-lucide="users" class="w-4 h-4 text-slate-400 group-hover:text-[#0f4c42]"></i>
                    </div>
                    <div class="text-[10px] font-bold text-[#0f4c42] flex items-center gap-1 group-hover:translate-x-1 transition-transform pt-2">
                      Masuk Kelola Kelas &rarr;
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>

          </div>
        `;
      }

      pilihGrade(grade) {
        this.selectedGrade = grade;
        this.classTab = 'soal';
        this.render();
      }

      // 3. MENU DALAM KELAS
      renderMenuKelasView() {
        const subj = this.selectedSubject;
        const grade = this.selectedGrade;
        const tab = this.classTab;

        return `
          <div class="space-y-6">
            
            <div class="flex justify-between items-center flex-wrap gap-2">
              <div class="text-xs font-bold text-slate-500 flex items-center gap-1">
                <button onclick="window.guruApp.selectedSubject=null; window.guruApp.selectedGrade=null; window.guruApp.render();" class="hover:underline">Dashboard</button> / 
                <button onclick="window.guruApp.selectedGrade=null; window.guruApp.render();" class="hover:underline">${subj}</button> / 
                <span class="text-[#0f4c42]">Kelas ${grade}</span>
              </div>

              <button onclick="window.guruApp.selectedGrade=null; window.guruApp.render();" class="text-xs font-bold text-slate-600 bg-white hover:bg-slate-100 px-3 py-1.5 rounded-xl border border-slate-200 flex items-center gap-1">
                &larr; Kembali ke Daftar Kelas
              </button>
            </div>

            <!-- HEADER KELAS & TAB MENU -->
            <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
              <div class="flex justify-between items-center flex-wrap gap-3 border-b border-slate-200 pb-4">
                <div>
                  <div class="flex items-center gap-2">
                    <span class="bg-amber-100 text-amber-900 text-[10px] font-black uppercase px-2.5 py-1 rounded-full">Kelas ${grade}</span>
                    <span class="bg-emerald-100 text-emerald-900 text-[10px] font-black uppercase px-2.5 py-1 rounded-full">${subj}</span>
                  </div>
                  <h3 class="font-bold text-slate-900 text-lg mt-1">Ruang Kelola Kelas ${grade} — ${subj}</h3>
                </div>

                <div class="bg-slate-100 p-1 rounded-2xl border border-slate-200 flex gap-1">
                  <button onclick="window.guruApp.classTab='soal'; window.guruApp.render();" class="px-5 py-2 rounded-xl text-xs font-bold uppercase transition-all ${tab === 'soal' ? 'bg-[#0f4c42] text-white shadow' : 'text-slate-600 hover:text-slate-900'}">
                    Bank Soal
                  </button>
                  <button onclick="window.guruApp.classTab='nilai'; window.guruApp.render();" class="px-5 py-2 rounded-xl text-xs font-bold uppercase transition-all ${tab === 'nilai' ? 'bg-[#0f4c42] text-white shadow' : 'text-slate-600 hover:text-slate-900'}">
                    Hasil Ujian & Koreksi
                  </button>
                </div>
              </div>

              ${tab === 'soal' ? this.renderTabBankSoalKelas() : ''}
              ${tab === 'nilai' ? this.renderTabHasilUjianKelas() : ''}
            </div>

          </div>
        `;
      }

      // TAB A: BANK SOAL DALAM KELAS
      renderTabBankSoalKelas() {
        const db = this.db;
        const subj = this.selectedSubject;
        const grade = this.selectedGrade;

        const questions = (db.questions || []).filter(q => (!q.subject || q.subject === subj) && (!q.grade || q.grade === grade));

        return `
          <div class="space-y-6 pt-2">
            
            <div class="flex justify-between items-center flex-wrap gap-2">

      prosesGenerasiTemplateSoal(e) {
        e.preventDefault();
        const checkedTypes = Array.from(document.querySelectorAll('input[name="m_type_check"]:checked')).map(cb => cb.value);
        const creationMode = document.querySelector('input[name="m_creation_mode"]:checked').value;
        const randQ = document.getElementById('m_rand_questions').checked;
        const randOpt = document.getElementById('m_rand_options').checked;

        if (checkedTypes.length === 0) {
          this.showToast('Pilih minimal 1 jenis soal!', 'error');
          return;
        }

        this.creationMode = creationMode;
        this.isRandomQuestions = randQ;
        this.isRandomOptions = randOpt;

        this.generatedSlots = [];
        let totalCount = 0;

        checkedTypes.forEach(type => {
          const count = parseInt(document.getElementById(`m_count_${type}`).value) || 0;
          if (count > 0) {
            totalCount += count;
            for (let i = 0; i < count; i++) {
              this.generatedSlots.push({
                id: 'Q_' + Date.now() + '_' + type + '_' + i,
                type: type,
                text: '',
                imageUrl: '',
                options: type === 'esai' ? [] : (type === 'benar_salah' ? ['Benar', 'Salah'] : ['A', 'B', 'C', 'D']),
                answer: '',
                score: Math.round(100 / (totalCount || 1)),
                isRandomQ: randQ,
                isRandomOpt: type !== 'esai' ? randOpt : false
              });
            }
          }
        });

        this.closeModal();

        if (creationMode === 'word') {
          setTimeout(() => {
            document.getElementById('import-soal-doc').click();
          }, 300);
        } else {
          this.showToast(`Form ${totalCount} soal siap diisi!`);
          this.render();
        }
      }

      downloadDocxGuide() {
        const textContent = `PANDUAN FORMAT SOAL WORD (.DOCX) - E-CBT AIP CLOUD\n\n` +
          `Ketikkan soal di Microsoft Word dengan format struktur sederhana berikut:\n\n` +
          `1. Pertanyaan soal nomor pertama (Pilihan Ganda)\n` +
          `A. Pilihan jawaban A\n` +
          `B. Pilihan jawaban B\n` +
          `C. Pilihan jawaban C\n` +
          `D. Pilihan jawaban D\n` +
          `KUNCI: A\n\n` +
          `2. Pertanyaan soal nomor kedua (Esai/Uraian)\n` +
          `KUNCI: Kunci jawaban uraian singkat\n`;

        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", "Panduan_Format_Soal_Word.txt");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        this.showToast('File petunjuk format berhasil diunduh!');
      }

      handleUploadDocxTemplate(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const arrayBuffer = evt.target.result;
          
          mammoth.extractRawText({ arrayBuffer: arrayBuffer })
            .then((result) => {
              const fullText = result.value;
              const lines = fullText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
              
              let parsedSlots = [];
              let currentSlot = null;

              lines.forEach(line => {
                if (/^\d+[\.\)]/.test(line)) {
                  if (currentSlot) parsedSlots.push(currentSlot);
                  currentSlot = {
                    id: 'Q_' + Date.now() + '_' + parsedSlots.length,
                    type: 'pg_tunggal',
                    text: line.replace(/^\d+[\.\)]\s*/, ''),
                    imageUrl: '',
                    options: [],
                    answer: '',
                    score: 20,
                    isRandomQ: this.isRandomQuestions,
                    isRandomOpt: this.isRandomOptions
                  };
                } else if (currentSlot) {
                  if (/^[A-E][\.\)]/i.test(line)) {
                    currentSlot.options.push(line.replace(/^[A-E][\.\)]\s*/i, ''));
                  } else if (/^KUNCI:/i.test(line)) {
                    currentSlot.answer = line.replace(/^KUNCI:\s*/i, '');
                  }
                }
              });

              if (currentSlot) parsedSlots.push(currentSlot);

              if (parsedSlots.length > 0) {
                this.generatedSlots = parsedSlots;
                this.showToast(`Berhasil membaca ${parsedSlots.length} soal dari file Word (.docx)!`);
                this.render();
              } else {
                this.showToast('Gagal mengekstrak soal. Pastikan nomor diawali angka (1. 2. 3.)', 'error');
              }
            })
            .catch((err) => {
              this.showToast('Error membaca file Word (.docx)', 'error');
            });

          e.target.value = '';
        };
        reader.readAsArrayBuffer(file);
      }

      saveEditedQuestion(e, qIdx) {

        const text = document.getElementById('edit-q-text').value.trim();
        const imageUrl = document.getElementById('edit-q-image').value.trim();

        db.questions[qIdx].score = score;
        db.questions[qIdx].text = text;
        db.questions[qIdx].imageUrl = imageUrl;

        if (db.questions[qIdx].type !== 'esai') {
          const optionsInput = document.getElementById('edit-q-options').value;
          const answerInput = document.getElementById('edit-q-answer').value;

          db.questions[qIdx].options = optionsInput.split(',').map(s => s.trim()).filter(s => s.length > 0);

            db.questions[qIdx].answer = answerInput.split(',').map(s => s.trim()).filter(s => s.length > 0);

          }
        }

        this.saveDB(db);
        this.showToast('Soal Berhasil Diperbarui!');
        this.closeModal();
        this.render();

            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-700">
                <thead class="bg-slate-100 font-bold text-slate-800 uppercase">
                  <tr>
                    <th class="p-3 rounded-l-xl">No</th>
                    <th class="p-3">ID Siswa</th>
                    <th class="p-3">Nama Siswa</th>
                    <th class="p-3">Skor PG</th>
                    <th class="p-3">Skor Esai</th>
                    <th class="p-3">Total Nilai</th>
                    <th class="p-3 rounded-r-xl text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${results.map((r, idx) => `
                    <tr>
                      <td class="p-3 font-bold">${idx + 1}</td>
                      <td class="p-3 font-mono font-bold text-emerald-800">${r.studentId || (idx + 1).toString().padStart(3, '0')}</td>
                      <td class="p-3 font-bold text-slate-900">${r.studentName}</td>
                      <td class="p-3 font-bold text-emerald-700">${r.pgScore || 0}</td>
                      <td class="p-3 font-bold text-amber-700">${r.essayScore || 0}</td>
                      <td class="p-3"><span class="bg-emerald-100 text-emerald-900 font-black px-2.5 py-1 rounded text-xs">${(r.pgScore || 0) + (r.essayScore || 0)}</span></td>
                      <td class="p-3 text-right">
                        <button onclick="window.guruApp.openKoreksiModal(${idx})" class="bg-[#0f4c42] text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">
                          Koreksi Esai
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
              ${results.length === 0 ? `<p class="text-xs text-slate-400 text-center py-6">Belum ada hasil ujian masuk dari siswa kelas ini.</p>` : ''}
            </div>
          </div>
        `;
      }

      downloadExcelResults() {
        const db = this.db;
        const subj = this.selectedSubject;
        const grade = this.selectedGrade;

        const results = (db.examResults || []).filter(r => (!r.subject || r.subject === subj) && (!r.grade || r.grade === grade));

        if (results.length === 0) {
          this.showToast('Belum ada data nilai untuk diunduh!', 'error');
          return;
        }

        const gradeMapelText = `${grade}/${subj}`;

        const excelData = [
          ['NILAI SISWA', '', '', ''],
          ['Kelas/Mapel', gradeMapelText, '', ''],
          ['', '', '', ''],
          ['No', 'ID Siswa', 'Nama', 'Nilai']
        ];

        results.forEach((r, idx) => {
          excelData.push([
            idx + 1,
            r.studentId || (idx + 1).toString().padStart(3, '0'),
            r.studentName || '',
            (r.pgScore || 0) + (r.essayScore || 0)
          ]);
        });

        const worksheet = XLSX.utils.aoa_to_sheet(excelData);
        
        worksheet['!cols'] = [
          { wch: 8 },  
          { wch: 15 }, 
          { wch: 35 }, 
          { wch: 12 }  
        ];

        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, 'Sheet1');

        XLSX.writeFile(workbook, `Nilai_Siswa_${subj}_Kelas_${grade}.xlsx`);
        this.showToast('File Rekap Nilai Excel Berhasil Diunduh!');
      }

      openKoreksiModal(resIdx) {
        const db = this.db;
        const res = db.examResults[resIdx];
        if (!res) return;

        this.showModal(`
          <div class="space-y-4 text-xs">
            <h3 class="font-bold text-slate-900 text-sm">Koreksi Esai: ${res.studentName}</h3>
            
            <form onsubmit="window.guruApp.saveKoreksi(event, ${resIdx})" class="space-y-3">
              <div>
                <label class="block font-bold text-slate-700 mb-1">Input Nilai Tambahan Esai (0 - 100)</label>
                <input type="number" id="essay-score-input" value="${res.essayScore || 0}" min="0" max="100" required class="w-full p-2.5 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-[#0f4c42]">
              </div>

              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.guruApp.closeModal()" class="px-4 py-2 rounded-xl font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl font-bold text-white bg-[#0f4c42]">Simpan Nilai Realtime</button>
              </div>
            </form>
          </div>
        `);
      }

      saveKoreksi(e, resIdx) {
        e.preventDefault();
        const db = this.db;
        const score = parseFloat(document.getElementById('essay-score-input').value) || 0;
        
        if (db.examResults[resIdx]) {
          db.examResults[resIdx].essayScore = score;
          db.examResults[resIdx].totalScore = (db.examResults[resIdx].pgScore || 0) + score;
          this.saveDB(db);
          this.showToast('Nilai Esai Berhasil Diperbarui!');
        }
        this.closeModal();
        this.render();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.guruApp = new GuruApp();
    });
  </script>
</body>
</html>
