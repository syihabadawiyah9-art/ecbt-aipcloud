<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guru - E-CBT AIP CLOUD - MTs Al Ishlah Panambangan</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- MathJax CDN -->
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
  <!-- Mammoth JS (Untuk Membaca File Word .docx di Browser) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <!-- Font Serif Display & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Firebase Compatibility SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-hero { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="bg-slate-200 min-h-screen flex flex-col justify-between text-slate-800">

  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <div id="modal-container" class="fixed inset-0 z-40 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div id="modal-content" class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 transform transition-all scale-95 opacity-0 max-h-[90vh] overflow-y-auto"></div>
  </div>

  <!-- Hidden File Input khusus dokumen Microsoft Word (.docx) -->
  <input type="file" id="import-soal-doc" accept=".docx" class="hidden" onchange="window.guruApp.handleUploadDocxTemplate(event)">

  <!-- HEADER / NAVBAR -->
  <header class="bg-[#0f4c42] text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-20">
        
        <a href="../index.html" class="flex items-center gap-3">
          <img src="../aset/mts.png" alt="Logo AIP Cloud" class="w-12 h-12 object-contain drop-shadow" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2991/2991108.png';">
          <div>
            <h1 class="font-hero font-black text-xl sm:text-2xl tracking-wider text-white">E - C B T &nbsp; A I P &nbsp; C L O U D</h1>
            <p class="text-[10px] sm:text-[11px] text-emerald-200 tracking-wide font-medium">PORTAL GURU - KELOLA SOAL & NILAI UJIAN</p>
          </div>
        </a>

        <nav id="nav-menu" class="flex items-center gap-4 text-sm font-bold tracking-wider">
          <a href="../index.html" id="btn-nav-beranda" class="hover:text-amber-300 transition-colors">BERANDA</a>
          <button id="btn-nav-login" onclick="window.guruApp.openLoginModal()" class="text-amber-300 border-b-2 border-amber-300 pb-1">LOGIN GURU</button>
          
          <div id="guru-logged-badge" class="hidden flex items-center gap-3">
            <span id="txt-guru-name" class="text-xs font-bold text-amber-300 tracking-wider uppercase"></span>
            <button onclick="window.guruApp.logout()" class="flex items-center gap-1 text-xs font-bold text-rose-300 hover:text-white bg-rose-900/60 hover:bg-rose-900 px-3 py-1.5 rounded-lg transition-all border border-rose-700">
              <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
              KELUAR
            </button>
          </div>
        </nav>

      </div>
    </div>
  </header>

  <!-- MAIN DYNAMIC CONTENT -->
  <main id="app-view" class="flex-grow flex items-center justify-center p-6 sm:p-12">
    <!-- Diisi via JS -->
  </main>

  <!-- FOOTER -->
  <footer class="bg-white border-t border-slate-300 py-6 text-center shadow-inner">
    <div class="max-w-7xl mx-auto px-4 flex flex-col items-center justify-center gap-2">
      <img src="../aset/aip%201.png" alt="Logo MTs Al Ishlah Panambangan" class="w-10 h-10 object-contain" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/2991/2991108.png';">
      <p class="text-xs sm:text-sm font-bold text-slate-700 tracking-wider uppercase">
        AIP CLOUD – MTS AL ISHLAH PANAMBANGAN @ 2026 – APLIKASI UJIAN BERBASIS KOMPUTER
      </p>
    </div>
  </footer>

  <script>
    // Firebase Realtime Database
    const firebaseConfig = {
      apiKey: "AIzaSyAQlu_WVDBVlmSg4C83euSkEs-SbaxbBbU",
      authDomain: "ecbt-aipcloud.firebaseapp.com",
      databaseURL: "https://ecbt-aipcloud-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "ecbt-aipcloud",
      storageBucket: "ecbt-aipcloud.firebasestorage.app",
      messagingSenderId: "810156327221",
      appId: "1:810156327221:web:7bf52383c0d89fac228c7c",
      measurementId: "G-0JP7K0DFY7"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const dbRealtime = firebase.database();

    let cacheData = null;

    class DBController {
      static initListener(callback) {
        dbRealtime.ref('cbt_db').on('value', (snapshot) => {
          cacheData = snapshot.val() || {};
          if (!cacheData.teachers) cacheData.teachers = [];
          if (!cacheData.questions) cacheData.questions = [];
          if (!cacheData.examResults) cacheData.examResults = [];
          if (callback) callback();
        });
      }

      static get() {
        return cacheData || { teachers: [], questions: [], examResults: [] };
      }

      static save(data) {
        cacheData = data;
        dbRealtime.ref('cbt_db').set(data);
      }
    }

    class GuruApp {
      constructor() {
        this.activeTab = 'soal';
        this.activeGuru = null;
        this.bankConfig = null;
        this.generatedSlots = []; 
        DBController.initListener(() => this.render());
      }

      get db() { return DBController.get(); }
      saveDB(data) { DBController.save(data); }

      showToast(msg, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `p-4 rounded-xl shadow-lg text-white text-xs font-bold transition-all duration-300 ${type === 'error' ? 'bg-rose-600' : 'bg-emerald-600'}`;
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
      }

      openLoginModal() {
        this.showModal(`
          <div class="space-y-4">
            <div class="text-center">
              <div class="inline-flex bg-emerald-100 p-3 rounded-2xl text-[#0f4c42] mb-2">
                <i data-lucide="user-check" class="w-6 h-6"></i>
              </div>
              <h3 class="font-bold text-slate-900 text-lg">Login Guru Pengampu</h3>
              <p class="text-xs text-slate-500">Masukkan Username & Password Akun Guru Anda</p>
            </div>

            <form onsubmit="window.guruApp.handleLogin(event)" class="space-y-3">
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Username Guru</label>
                <input type="text" id="g-user" required placeholder="syihabadaw" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                <input type="password" id="g-pass" required value="123" placeholder="Password" class="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-[#0f4c42] outline-none">
              </div>
              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.guruApp.closeModal()" class="px-4 py-2 rounded-xl text-xs font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl text-xs font-bold text-white bg-[#0f4c42] hover:bg-[#0d3b36]">Masuk Portal Guru</button>
              </div>
            </form>
          </div>
        `);
        if (window.lucide) lucide.createIcons();
      }

      showModal(html) {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.innerHTML = html;
        container.classList.remove('hidden');
        setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
      }

      closeModal() {
        const container = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        content.classList.add('scale-95', 'opacity-0');
        setTimeout(() => container.classList.add('hidden'), 200);
      }

      handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('g-user').value.trim();
        const p = document.getElementById('g-pass').value.trim();
        const db = this.db;

        const guru = (db.teachers || []).find(t => t.username === u && (t.password || '123') === p);

        if (guru) {
          this.activeGuru = guru;
          this.closeModal();
          this.showToast(`Login Berhasil! Selamat datang ${guru.name}`);
          this.render();
        } else {
          this.showToast('Username atau Password Guru salah!', 'error');
        }
      }

      logout() {
        this.activeGuru = null;
        this.bankConfig = null;
        this.generatedSlots = [];
        this.showToast('Berhasil keluar');
        this.render();
      }

      setTab(tab) {
        this.activeTab = tab;
        this.render();
      }

      render() {
        const appView = document.getElementById('app-view');
        const btnNavLogin = document.getElementById('btn-nav-login');
        const btnNavBeranda = document.getElementById('btn-nav-beranda');
        const guruBadge = document.getElementById('guru-logged-badge');

        if (this.activeGuru) {
          btnNavLogin.classList.add('hidden');
          btnNavBeranda.classList.add('hidden');
          guruBadge.classList.remove('hidden');
          document.getElementById('txt-guru-name').innerText = this.activeGuru.name;

          appView.className = "flex-grow max-w-5xl w-full mx-auto p-4 sm:p-8 space-y-6";
          appView.innerHTML = this.renderGuruDashboard();
        } else {
          btnNavLogin.classList.remove('hidden');
          btnNavBeranda.classList.remove('hidden');
          guruBadge.classList.add('hidden');

          appView.className = "flex-grow flex items-center justify-center p-6 sm:p-12";
          appView.innerHTML = this.renderGuruHero();
        }

        if (window.MathJax) MathJax.typesetPromise();
        if (window.lucide) lucide.createIcons();
      }

      renderGuruHero() {
        return `
          <div class="text-center max-w-4xl mx-auto space-y-6">
            <h2 class="font-hero text-4xl sm:text-5xl md:text-6xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              Selamat Datang
            </h2>
            <h3 class="font-hero text-3xl sm:text-4xl md:text-5xl font-black text-slate-900 leading-tight uppercase tracking-wide">
              BAPAK / IBU GURU DI
            </h3>
            <h1 class="font-hero text-4xl sm:text-6xl md:text-7xl font-black text-slate-900 leading-tight uppercase tracking-wider drop-shadow-sm">
              E-CBT AIP CLOUD
            </h1>
            <p class="font-hero text-lg sm:text-2xl md:text-3xl font-extrabold text-slate-800 tracking-widest pt-4">
              PORTAL KELOLA SOAL & ANALISIS NILAI UJIAN
            </p>
            <div class="pt-8">
              <button onclick="window.guruApp.openLoginModal()" class="bg-[#0f4c42] hover:bg-[#0d3b36] text-white px-8 py-3.5 rounded-xl font-bold shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-0.5 text-sm uppercase tracking-wider">
                Klik Untuk Login Guru
              </button>
            </div>
          </div>
        `;
      }

      renderGuruDashboard() {
        const tab = this.activeTab;

        return `
          <div class="bg-white/80 p-2 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-center gap-2 flex-wrap max-w-xl mx-auto">
            <button onclick="window.guruApp.setTab('soal')" class="px-6 py-2 rounded-xl text-xs font-bold uppercase transition-all ${tab === 'soal' ? 'bg-slate-300/80 text-slate-800 shadow-inner' : 'bg-slate-200/50 text-slate-600 hover:bg-slate-200'}">
              BANK SOAL
            </button>
            <button onclick="window.guruApp.setTab('nilai')" class="px-6 py-2 rounded-xl text-xs font-bold uppercase transition-all ${tab === 'nilai' ? 'bg-slate-300/80 text-slate-800 shadow-inner' : 'bg-slate-200/50 text-slate-600 hover:bg-slate-200'}">
              HASIL UJIAN & KOREKSI
            </button>
          </div>

          ${tab === 'soal' ? this.renderTabSoalContent() : ''}
          ${tab === 'nilai' ? this.renderTabNilaiContent() : ''}
        `;
      }

      renderTabSoalContent() {
        if (!this.bankConfig) {
          return this.renderConfigBankSoalForm();
        } else {
          return this.renderFormPembuatanSoal();
        }
      }

      // LANGKAH 1: PENGATURAN KELAS/TINGKAT, MATA PELAJARAN, MULTI JENIS & JUMLAH SOAL
      renderConfigBankSoalForm() {
        const subjects = this.activeGuru.subjects || ['Informatika', 'BK'];

        const targetGrades = [
          { id: '7', label: 'Kelas 7' },
          { id: '8', label: 'Kelas 8' },
          { id: '9', label: 'Kelas 9' },
          { id: 'olimpiade', label: 'Olimpiade' }
        ];

        const questionTypes = [
          { id: 'pg_tunggal', label: 'Pilihan Ganda Tunggal' },
          { id: 'pg_kompleks', label: 'Pilihan Ganda Kompleks (Banyak Jawaban)' },
          { id: 'benar_salah', label: 'Benar / Salah' },
          { id: 'esai', label: 'Esai / Uraian' }
        ];

        return `
          <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm max-w-xl mx-auto space-y-6">
            <div class="text-center space-y-1 border-b border-slate-100 pb-4">
              <h3 class="font-bold text-slate-900 text-lg">Pengaturan Bank Soal Baru</h3>
              <p class="text-xs text-slate-500">Pilih Kelas, Mata Pelajaran, Kombinasi Jenis Soal, dan Jumlah Soalnya</p>
            </div>

            <form onsubmit="window.guruApp.handleGenerateSlots(event)" class="space-y-5 text-xs">
              
              <!-- PILIH KELAS / TINGKAT -->
              <div>
                <label class="block font-bold text-slate-700 mb-1">Pilih Kelas / Peruntukan Soal</label>
                <select id="cfg-grade" required class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none font-bold">
                  ${targetGrades.map(g => `<option value="${g.id}">${g.label}</option>`).join('')}
                </select>
              </div>

              <!-- PILIH MAPEL -->
              <div>
                <label class="block font-bold text-slate-700 mb-1">Pilih Mata Pelajaran</label>
                <select id="cfg-subj" required class="w-full p-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none font-bold">
                  ${subjects.map(s => `<option value="${s}">${s}</option>`).join('')}
                </select>
              </div>

              <!-- PILIH JENIS & JUMLAH SOAL -->
              <div>
                <label class="block font-bold text-slate-700 mb-2">Pilih Jenis Soal & Jumlahnya</label>
                <div class="space-y-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                  ${questionTypes.map(t => `
                    <div class="flex items-center justify-between gap-3 bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm">
                      <label class="flex items-center gap-2 cursor-pointer font-bold text-slate-700 text-xs">
                        <input type="checkbox" name="type_check" value="${t.id}" onchange="window.guruApp.toggleTypeInput('${t.id}', this.checked)" class="w-4 h-4 text-[#0f4c42] rounded focus:ring-[#0f4c42]">
                        <span>${t.label}</span>
                      </label>
                      <div class="flex items-center gap-1">
                        <span class="text-[10px] font-bold text-slate-400">Jumlah:</span>
                        <input type="number" id="count_${t.id}" min="1" max="100" value="5" disabled class="w-16 p-1.5 border border-slate-200 rounded-lg text-center font-bold bg-slate-100 text-slate-400 outline-none">
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <button type="submit" class="w-full bg-[#0f4c42] hover:bg-[#0d3b36] text-white py-3.5 rounded-xl font-bold uppercase tracking-wider shadow-md transition-all">
                Buat Template Soal Kombinasi &rarr;
              </button>
            </form>
          </div>
        `;
      }

      toggleTypeInput(typeId, checked) {
        const input = document.getElementById(`count_${typeId}`);
        if (input) {
          input.disabled = !checked;
          if (checked) {
            input.classList.remove('bg-slate-100', 'text-slate-400');
            input.classList.add('bg-white', 'text-slate-800', 'border-[#0f4c42]');
          } else {
            input.classList.add('bg-slate-100', 'text-slate-400');
            input.classList.remove('bg-white', 'text-slate-800', 'border-[#0f4c42]');
          }
        }
      }

      handleGenerateSlots(e) {
        e.preventDefault();
        const grade = document.getElementById('cfg-grade').value;
        const subj = document.getElementById('cfg-subj').value;
        const checkedTypes = Array.from(document.querySelectorAll('input[name="type_check"]:checked')).map(cb => cb.value);

        if (checkedTypes.length === 0) {
          this.showToast('Pilih minimal 1 jenis soal!', 'error');
          return;
        }

        let typeConfigs = [];
        let totalCount = 0;
        this.generatedSlots = [];

        checkedTypes.forEach(type => {
          const count = parseInt(document.getElementById(`count_${type}`).value) || 0;
          if (count > 0) {
            typeConfigs.push({ type, count });
            totalCount += count;

            for (let i = 0; i < count; i++) {
              this.generatedSlots.push({
                id: 'Q_' + Date.now() + '_' + type + '_' + i,
                type: type,
                text: '',
                imageUrl: '',
                options: type === 'esai' ? [] : (type === 'benar_salah' ? ['Benar', 'Salah'] : ['A', 'B', 'C', 'D']),
                answer: '',
                score: Math.round(100 / (totalCount || 1))
              });
            }
          }
        });

        this.bankConfig = { grade: grade, subject: subj, types: typeConfigs, totalCount: totalCount };

        this.showToast(`Template ${totalCount} soal kombinasi berhasil dibuat!`);
        this.render();
      }

      // LANGKAH 2: FORM ISI SOAL & FITUR UNDUH/UNGGAH WORD (.DOCX)
      renderFormPembuatanSoal() {
        const cfg = this.bankConfig;
        const gradeLabel = cfg.grade === 'olimpiade' ? 'Olimpiade' : `Kelas ${cfg.grade}`;

        return `
          <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-6">
            
            <div class="flex justify-between items-center flex-wrap gap-3 border-b border-slate-200 pb-4">
              <div>
                <div class="flex items-center gap-2">
                  <span class="bg-amber-100 text-amber-900 text-[10px] font-black uppercase px-2.5 py-1 rounded-full">${gradeLabel}</span>
                  <span class="bg-emerald-100 text-emerald-900 text-[10px] font-black uppercase px-2.5 py-1 rounded-full">${cfg.subject}</span>
                </div>
                <h3 class="font-bold text-slate-900 text-base mt-1">
                  Template Soal Kombinasi (${cfg.totalCount} Soal Total)
                </h3>
              </div>

              <!-- DUA OPSI: DOKUMEN WORD (.DOCX) ATAU MANUAL -->
              <div class="flex items-center gap-2 flex-wrap">
                <button onclick="window.guruApp.downloadDocxGuide()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1 border border-slate-300">
                  <i data-lucide="file-text" class="w-3.5 h-3.5"></i> Unduh Panduan Format Word
                </button>
                <button onclick="document.getElementById('import-soal-doc').click()" class="bg-blue-50 hover:bg-blue-100 text-blue-800 px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1 border border-blue-300">
                  <i data-lucide="upload-cloud" class="w-3.5 h-3.5"></i> Unggah File Word (.docx)
                </button>
                <button onclick="window.guruApp.resetConfig()" class="bg-rose-50 text-rose-700 hover:bg-rose-100 px-3 py-2 rounded-xl text-xs font-bold border border-rose-200">
                  Ulangi
                </button>
              </div>
            </div>

            <!-- FORM MANUAL DI WEB -->
            <form onsubmit="window.guruApp.saveAllQuestionsToCloud(event)" class="space-y-6">
              <div class="space-y-4">
                ${this.generatedSlots.map((s, idx) => `
                  <div class="p-5 bg-slate-50 rounded-2xl border border-slate-200 space-y-3 text-xs">
                    <div class="flex justify-between items-center font-bold text-slate-800 border-b border-slate-200 pb-2">
                      <div class="flex items-center gap-2">
                        <span class="text-[#0f4c42]">Soal No. ${idx + 1}</span>
                        <span class="bg-slate-200 text-slate-700 text-[10px] px-2 py-0.5 rounded font-extrabold uppercase">${s.type.replace('_', ' ')}</span>
                      </div>
                      <div class="flex items-center gap-2">
                        <span>Bobot Nilai:</span>
                        <input type="number" value="${s.score}" onchange="window.guruApp.updateSlotScore(${idx}, this.value)" class="w-16 p-1 border rounded text-center font-bold">
                      </div>
                    </div>

                    <div>
                      <label class="block font-bold text-slate-700 mb-1">Pertanyaan Soal</label>
                      <textarea rows="2" required placeholder="Tuliskan isi pertanyaan soal no. ${idx + 1} di sini..." oninput="window.guruApp.updateSlotText(${idx}, this.value)" class="w-full p-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none">${s.text}</textarea>
                    </div>

                    <div>
                      <label class="block font-bold text-slate-700 mb-1">URL Gambar (Opsional)</label>
                      <input type="text" placeholder="https://..." value="${s.imageUrl || ''}" oninput="window.guruApp.updateSlotImage(${idx}, this.value)" class="w-full p-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none">
                    </div>

                    ${s.type !== 'esai' ? `
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                        <div>
                          <label class="block font-bold text-slate-700 mb-1">Pilihan Jawaban (Pisahkan Komma)</label>
                          <input type="text" value="${s.options.join(', ')}" oninput="window.guruApp.updateSlotOptions(${idx}, this.value)" placeholder="Pilihan A, Pilihan B, Pilihan C, Pilihan D" class="w-full p-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none">
                        </div>
                        <div>
                          <label class="block font-bold text-slate-700 mb-1">Kunci Jawaban Tepat</label>
                          <input type="text" value="${s.answer || ''}" required oninput="window.guruApp.updateSlotAnswer(${idx}, this.value)" placeholder="Kunci Jawaban" class="w-full p-2 border border-slate-200 rounded-xl focus:ring-2 focus:ring-[#0f4c42] outline-none font-bold">
                        </div>
                      </div>
                    ` : ''}
                  </div>
                `).join('')}
              </div>

              <div class="pt-4 border-t border-slate-200 flex justify-end">
                <button type="submit" class="bg-[#0f4c42] hover:bg-[#0d3b36] text-white px-8 py-3 rounded-xl font-bold uppercase tracking-wider text-xs shadow-lg">
                  Simpan Semua Soal ke Cloud Realtime
                </button>
              </div>
            </form>

          </div>
        `;
      }

      updateSlotText(idx, val) { this.generatedSlots[idx].text = val; }
      updateSlotImage(idx, val) { this.generatedSlots[idx].imageUrl = val; }
      updateSlotScore(idx, val) { this.generatedSlots[idx].score = parseFloat(val) || 0; }
      updateSlotAnswer(idx, val) { this.generatedSlots[idx].answer = val.trim(); }
      updateSlotOptions(idx, val) { 
        this.generatedSlots[idx].options = val.split(',').map(s => s.trim()); 
      }

      resetConfig() {
        if (confirm('Ulangi pengaturan bank soal?')) {
          this.bankConfig = null;
          this.generatedSlots = [];
          this.render();
        }
      }

      // UNDUH PETUNJUK FORMAT WORD (.DOCX)
      downloadDocxGuide() {
        const textContent = `PANDUAN FORMAT SOAL WORD (.DOCX) - E-CBT AIP CLOUD\n\n` +
          `Ketikkan soal di Microsoft Word dengan format struktur sederhana berikut:\n\n` +
          `1. Pertanyaan soal nomor pertama (Pilihan Ganda)\n` +
          `A. Pilihan jawaban A\n` +
          `B. Pilihan jawaban B\n` +
          `C. Pilihan jawaban C\n` +
          `D. Pilihan jawaban D\n` +
          `KUNCI: A\n\n` +
          `2. Pertanyaan soal nomor kedua (Esai/Uraian)\n` +
          `KUNCI: Kunci jawaban uraian singkat\n`;

        const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.setAttribute("download", "Panduan_Format_Soal_Word.txt");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        this.showToast('File petunjuk format berhasil diunduh!');
      }

      // UNGGAH DAN BACA FILE WORD (.DOCX) DENGAN MAMMOTH.JS
      handleUploadDocxTemplate(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (evt) => {
          const arrayBuffer = evt.target.result;
          
          mammoth.extractRawText({ arrayBuffer: arrayBuffer })
            .then((result) => {
              const fullText = result.value;
              const lines = fullText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
              
              let parsedSlots = [];
              let currentSlot = null;

              lines.forEach(line => {
                if (/^\d+[\.\)]/.test(line)) {
                  if (currentSlot) parsedSlots.push(currentSlot);
                  currentSlot = {
                    id: 'Q_' + Date.now() + '_' + parsedSlots.length,
                    type: 'pg_tunggal',
                    text: line.replace(/^\d+[\.\)]\s*/, ''),
                    imageUrl: '',
                    options: [],
                    answer: '',
                    score: 20
                  };
                } else if (currentSlot) {
                  if (/^[A-E][\.\)]/i.test(line)) {
                    currentSlot.options.push(line.replace(/^[A-E][\.\)]\s*/i, ''));
                  } else if (/^KUNCI:/i.test(line)) {
                    currentSlot.answer = line.replace(/^KUNCI:\s*/i, '');
                  }
                }
              });

              if (currentSlot) parsedSlots.push(currentSlot);

              if (parsedSlots.length > 0) {
                this.generatedSlots = parsedSlots;
                this.bankConfig = {
                  grade: this.bankConfig ? this.bankConfig.grade : '7',
                  subject: this.bankConfig ? this.bankConfig.subject : 'Informatika',
                  types: [{ type: 'pg_tunggal', count: parsedSlots.length }],
                  totalCount: parsedSlots.length
                };
                this.showToast(`Berhasil membaca ${parsedSlots.length} soal dari file Word (.docx)!`);
                this.render();
              } else {
                this.showToast('Gagal mengekstrak soal. Pastikan nomor diawali angka (1. 2. 3.)', 'error');
              }
            })
            .catch((err) => {
              this.showToast('Error membaca file Word (.docx)', 'error');
            });

          e.target.value = '';
        };
        reader.readAsArrayBuffer(file);
      }

      saveAllQuestionsToCloud(e) {
        e.preventDefault();
        const db = this.db;
        if (!db.questions) db.questions = [];

        this.generatedSlots.forEach(s => {
          db.questions.push({
            id: s.id,
            grade: this.bankConfig.grade,
            subject: this.bankConfig.subject,
            type: s.type || 'pg_tunggal',
            text: s.text,
            imageUrl: s.imageUrl,
            options: s.options,
            answer: s.answer,
            score: s.score
          });
        });

        this.saveDB(db);
        this.showToast('Semua Soal Berhasil Tersimpan di Cloud Realtime!');
        this.bankConfig = null;
        this.generatedSlots = [];
        this.render();
      }

      renderTabNilaiContent() {
        const db = this.db;
        const results = db.examResults || [];

        return `
          <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm space-y-4">
            <h3 class="font-bold text-slate-900 text-sm">Hasil Ujian Siswa (Live Realtime)</h3>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-slate-700">
                <thead class="bg-slate-100 font-bold text-slate-800 uppercase">
                  <tr>
                    <th class="p-3 rounded-l-xl">Siswa</th>
                    <th class="p-3">Kelas</th>
                    <th class="p-3">Mapel</th>
                    <th class="p-3">Skor PG</th>
                    <th class="p-3">Skor Esai</th>
                    <th class="p-3">Total Nilai</th>
                    <th class="p-3 rounded-r-xl text-right">Aksi</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${results.map((r, idx) => `
                    <tr>
                      <td class="p-3 font-bold text-slate-900">${r.studentName}</td>
                      <td class="p-3">Kelas ${r.grade}</td>
                      <td class="p-3 font-medium">${r.subject}</td>
                      <td class="p-3 font-bold text-emerald-700">${r.pgScore || 0}</td>
                      <td class="p-3 font-bold text-amber-700">${r.essayScore || 0}</td>
                      <td class="p-3"><span class="bg-emerald-100 text-emerald-900 font-black px-2 py-1 rounded text-xs">${(r.pgScore || 0) + (r.essayScore || 0)}</span></td>
                      <td class="p-3 text-right">
                        <button onclick="window.guruApp.openKoreksiModal(${idx})" class="bg-[#0f4c42] text-white px-3 py-1.5 rounded-lg text-[10px] font-bold">
                          Koreksi Esai
                        </button>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
              ${results.length === 0 ? `<p class="text-xs text-slate-400 text-center py-6">Belum ada hasil ujian masuk dari siswa.</p>` : ''}
            </div>
          </div>
        `;
      }

      openKoreksiModal(resIdx) {
        const db = this.db;
        const res = db.examResults[resIdx];
        if (!res) return;

        this.showModal(`
          <div class="space-y-4 text-xs">
            <h3 class="font-bold text-slate-900 text-sm">Koreksi Esai: ${res.studentName}</h3>
            
            <form onsubmit="window.guruApp.saveKoreksi(event, ${resIdx})" class="space-y-3">
              <div>
                <label class="block font-bold text-slate-700 mb-1">Input Nilai Tambahan Esai (0 - 100)</label>
                <input type="number" id="essay-score-input" value="${res.essayScore || 0}" min="0" max="100" required class="w-full p-2.5 border border-slate-200 rounded-xl font-bold text-sm outline-none focus:ring-2 focus:ring-[#0f4c42]">
              </div>

              <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="window.guruApp.closeModal()" class="px-4 py-2 rounded-xl font-bold text-slate-500 bg-slate-100">Batal</button>
                <button type="submit" class="px-5 py-2 rounded-xl font-bold text-white bg-[#0f4c42]">Simpan Nilai Realtime</button>
              </div>
            </form>
          </div>
        `);
      }

      saveKoreksi(e, resIdx) {
        e.preventDefault();
        const db = this.db;
        const score = parseFloat(document.getElementById('essay-score-input').value) || 0;
        
        if (db.examResults[resIdx]) {
          db.examResults[resIdx].essayScore = score;
          db.examResults[resIdx].totalScore = (db.examResults[resIdx].pgScore || 0) + score;
          this.saveDB(db);
          this.showToast('Nilai Esai Berhasil Diperbarui!');
        }
        this.closeModal();
        this.render();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.guruApp = new GuruApp();
    });
  </script>
</body>
</html>
